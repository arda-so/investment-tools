version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: investor_postgres
    environment:
      POSTGRES_DB: investor_os
      POSTGRES_USER: investor
      POSTGRES_PASSWORD: investor_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investor -d investor_os"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: investor_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: investor_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8766
      CORE_DB_BACKEND: postgres
      CORE_DB_GUARD_ENFORCE: "1"
      CORE_DB_STRICT_POSTGRES: "1"
      PHASE2_POSTGRES_ENABLED: "1"
      AI_QUEUE_BACKEND: postgres
      AI_QUEUE_STRICT_PROD: "1"
      POSTGRES_DSN: postgresql://investor:investor_dev@postgres:5432/investor_os
      AI_REDIS_URL: redis://redis:6379/0
    ports:
      - "8766:8766"
    command: ["/app/bin/run_v2_app"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8766/health/ready | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: .
    container_name: investor_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      CORE_DB_BACKEND: postgres
      CORE_DB_GUARD_ENFORCE: "1"
      CORE_DB_STRICT_POSTGRES: "1"
      PHASE2_POSTGRES_ENABLED: "1"
      AI_QUEUE_BACKEND: postgres
      AI_QUEUE_STRICT_PROD: "1"
      POSTGRES_DSN: postgresql://investor:investor_dev@postgres:5432/investor_os
      AI_REDIS_URL: redis://redis:6379/0
    command: ["/app/bin/run_ai_worker"]
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
