name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Install runtime deps
        run: pip install -r requirements.lock

      - name: Run quality gate
        run: ./bin/quality_gate.sh

      - name: Runtime smoke
        env:
          SMOKE_START_APP: "1"
          SMOKE_PORT: "8766"
        run: ./bin/smoke_runtime.sh
