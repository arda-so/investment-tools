<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Investor OS v2{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root{
      --bg:#eaf0f4;
      --panel:#f1f5f8;
      --panel2:#edf2f6;
      --border:#d6dee6;
      --border2:#c8d3dd;
      --text:#2f4358;
      --muted:#4f6780;
      --accent:#ff7a59;
      --accent-ink:#b5472f;
      --glass-bg:rgba(255,255,255,.72);
      --glass-border:rgba(255,255,255,.5);
      --glass-blur:14px;
      --glass-shadow:0 20px 56px rgba(15,23,42,.24);
      --glass-opacity:.94;
    }
    body.theme-dark{
      --bg:#0f172a;
      --panel:#111827;
      --panel2:#0b1220;
      --border:#1f2937;
      --border2:#334155;
      --text:#e2e8f0;
      --muted:#94a3b8;
    }
    html, body {
      margin:0;
      padding:0;
      height:100%;
    }
    body { background:var(--bg); color:var(--text); font-family:"Avenir Next","Helvetica Neue",sans-serif; }
    .global-shell{
      display:grid;
      grid-template-columns:1fr;
      grid-template-rows:auto minmax(0,1fr);
      height:100vh;
      min-height:100vh;
      margin:0;
      padding:0;
    }
    .global-shell.nav-collapsed{ grid-template-columns:1fr; }
    .global-nav{
      background:#1e293b;
      color:#dbe7f5;
      border-bottom:1px solid #2b3a52;
      padding:8px 12px;
      box-sizing:border-box;
      position:sticky;
      top:0;
      z-index:2000;
      height:auto;
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .global-brand{
      margin:0 10px 0 0;
      font-size:13px;
      font-weight:800;
      letter-spacing:.02em;
      color:#f1f5f9;
    }
    .global-link{
      display:block;
      text-decoration:none;
      color:#dbe7f5;
      padding:6px 10px;
      margin:0;
      border-left:none;
      border-bottom:2px solid transparent;
      border-radius:8px;
      font-size:12px;
      font-weight:700;
    }
    .global-link:hover{ background:rgba(255,255,255,.08); border-bottom-color:#8fa3bd; }
    .global-link.active{ background:rgba(255,255,255,.14); border-bottom-color:#ffffff; color:#fff; }
    .global-link-label{ display:inline; }
    .global-search-wrap{
      margin-left:auto;
      position:relative;
      min-width:280px;
      max-width:520px;
      flex:1 1 320px;
    }
    .global-search-input{
      width:100%;
      height:36px;
      border:1px solid #41556f;
      border-radius:10px;
      background:#0f1b2d;
      color:#e5eefb;
      padding:0 12px;
      font-size:13px;
      box-sizing:border-box;
    }
    .global-search-input::placeholder{ color:#a9bbd0; }
    .global-search-input:focus{
      outline:none;
      border-color:#7da1c9;
      box-shadow:0 0 0 2px rgba(125,161,201,.22);
    }
    .global-search-results{
      display:none;
      position:absolute;
      left:0;
      right:0;
      top:40px;
      z-index:2600;
      background:#fff;
      border:1px solid #d7e1ec;
      border-radius:12px;
      box-shadow:0 14px 30px rgba(15,23,42,.16);
      max-height:360px;
      overflow:auto;
    }
    .global-search-row{
      display:block;
      padding:10px 12px;
      border-bottom:1px solid #eef3f8;
      text-decoration:none;
      color:#1f2f46;
    }
    .global-search-row:last-child{ border-bottom:none; }
    .global-search-row:hover{ background:#f8fbff; }
    .global-search-title{ font-size:13px; font-weight:700; }
    .global-search-sub{ font-size:11px; color:#5d7288; margin-top:2px; }
    .global-search-kind{
      display:inline-block;
      margin-top:4px;
      font-size:10px;
      font-weight:700;
      color:#47627f;
      background:#eef5ff;
      border:1px solid #d4e3f4;
      border-radius:999px;
      padding:1px 7px;
    }
    .global-shell.nav-collapsed .global-link-label{ display:inline; }
    .global-shell.nav-collapsed .global-link{ border-bottom-color:transparent; }
    .global-shell.nav-collapsed .global-brand{ margin-right:10px; }
    .global-main{
      min-width:0;
      width:100%;
      background:#fff;
      height:100%;
      overflow:auto;
      margin:0;
      padding:0;
    }
    .global-omnibox-wrap{
      margin:0 0 4px 0;
      border:1px solid #dbe4ee;
      border-radius:12px;
      background:#fff;
      padding:6px 8px;
      box-shadow:0 2px 8px rgba(20,42,66,.04);
    }
    .global-omnibox{
      width:100%;
      height:44px;
      border:1px solid #cfdceb;
      border-radius:999px;
      padding:0 14px;
      font-size:14px;
      font-weight:600;
      color:#1f2f46;
      background:#f8fbff;
      box-sizing:border-box;
    }
    .global-omnibox:focus{
      outline:none;
      border-color:#86a6ca;
      box-shadow:0 0 0 3px rgba(134,166,202,.16);
      background:#fff;
    }
    .wrap {
      width:100%;
      max-width:none;
      margin:0;
      padding:0 20px 12px;
      box-sizing:border-box;
      padding-top:0 !important;
      margin-top:0 !important;
    }
    @media (max-width:900px) {
      .global-shell{ grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
      .global-shell.nav-collapsed{ grid-template-columns:1fr; }
      .global-nav{
        position:sticky;
        top:0;
        height:auto;
        border-right:none;
        border-bottom:1px solid #2b3a52;
        padding:8px 10px;
      }
      .wrap { padding:0 10px 10px; }
    }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; }
    .topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .title{font-weight:800;letter-spacing:.01em;}
    .btn { border:1px solid var(--border2); background:var(--panel2); color:var(--text); border-radius:8px; padding:6px 10px; text-decoration:none; font-size:12px; font-weight:700; cursor:pointer; }
    .btn-ghost-sm { border:none; background:transparent; color:var(--text2,#8a9baa); padding:2px 5px; font-size:12px; line-height:1; border-radius:4px; cursor:pointer; }
    .btn-ghost-sm:hover { background:var(--panel2,#edf2f6); color:var(--text,#2f4358); }
    input, textarea, select { width:100%; box-sizing:border-box; border:1px solid #c8d3dd; border-radius:8px; background:#edf2f6; color:#2f4358; padding:8px; }
    button { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:8px; padding:8px 10px; font-weight:700; cursor:pointer; }
    table { width:100%; border-collapse:collapse; }
    th, td { border-bottom:1px solid #d6dee6; padding:8px; text-align:left; vertical-align:top; }
    .muted { color:var(--muted); }
    .flash { margin-bottom:10px; padding:8px; border:1px solid #9fbad0; border-radius:8px; background:#edf2f6; }
    .grid { display:grid; grid-template-columns:1fr; gap:10px; }
    .grid3 { display:grid; grid-template-columns:1fr; gap:10px; }
    .stats { display:flex; gap:8px; flex-wrap:wrap; }
    .chip { padding:4px 10px; border-radius:999px; border:1px solid #c8d3dd; background:#edf2f6; font-size:12px; font-weight:700; }
    .kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:2px 6px;border:1px solid var(--border2);border-radius:6px;background:var(--panel2);}
    #cmdkOverlay{
      display:none;position:fixed;inset:0;background:rgba(15,23,42,.26);z-index:10000;
      backdrop-filter: blur(2px);
    }
    #cmdkCard{
      max-width:94vw;
      width:min(800px, calc(100vw - 28px));
      height:min(80vh, 920px);
      background:rgba(255,255,255,.85);
      border:1px solid var(--glass-border);
      border-radius:18px;
      padding:0;
      box-shadow:var(--glass-shadow);
      backdrop-filter: blur(12px);
      opacity:var(--glass-opacity);
      display:flex;
      flex-direction:column;
      position:fixed;
      left:50%;
      top:8vh;
      transform:translateX(-50%);
      resize:both;
      overflow:hidden;
      min-width:520px;
      min-height:420px;
    }
    #cmdkDragBar{ cursor:move; user-select:none; }
    .ai-head{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 14px; border-bottom:1px solid #e2e8f0; background:rgba(255,255,255,.7);
    }
    .ai-title{font-weight:800; font-size:14px; letter-spacing:.01em;}
    .ai-actions{display:flex; gap:6px; align-items:center;}
    .ai-icon-btn{
      border:1px solid #cbd5e1; background:#f8fafc; color:#334155;
      border-radius:8px; padding:4px 7px; font-weight:700; font-size:12px;
    }
    .ai-empty{
      height:100%; display:flex; align-items:center; justify-content:center;
      color:#64748b; font-size:20px; font-weight:700; text-align:center; padding:20px;
    }
    .ai-body{flex:1; min-height:0; display:flex; flex-direction:column;}
    .ai-history{
      flex:1; overflow-y:auto; padding:14px; background:rgba(248,250,252,.8);
    }
    .msg-row{display:flex; margin:10px 0;}
    .msg-user{justify-content:flex-end;}
    .msg-ai{justify-content:flex-start;}
    .msg-user .bubble{
      max-width:78%; background:#f1f5f9; color:#0f172a;
      border-radius:16px 6px 16px 16px; padding:10px 12px;
      font-size:15px; line-height:1.55;
      border:1px solid #e2e8f0;
    }
    .msg-ai .bubble{
      max-width:86%; background:#ffffff; color:#0f172a;
      border-radius:12px; padding:10px 12px; border:none;
      font-size:15px; line-height:1.6;
    }
    .msg-avatar{
      width:22px; height:22px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center;
      font-size:12px; margin-right:8px; margin-top:4px; background:#e2e8f0; color:#334155;
    }
    .md p{margin:0 0 10px 0;}
    .md p:last-child{margin-bottom:0;}
    .md ul,.md ol{margin:8px 0 12px 18px; padding:0;}
    .md li{margin:4px 0;}
    .md h1,.md h2,.md h3{margin:12px 0 8px 0; font-size:16px; line-height:1.35;}
    .num-pos{color:#15803d; font-weight:700;}
    .num-neg{color:#b91c1c; font-weight:700;}
    .msg-meta{
      margin-top:8px; font-size:11px; color:#64748b;
    }
    .msg-status{margin-top:8px; font-size:11px; color:#64748b;}
    .msg-audit{margin-top:8px; border:1px solid #d4deea; border-radius:10px; background:#f8fafc; overflow:hidden;}
    .msg-audit summary{
      list-style:none; cursor:pointer; padding:8px 10px; font-size:11px; font-weight:700; color:#334155;
      display:flex; align-items:center; gap:8px;
    }
    .msg-audit summary::-webkit-details-marker{display:none;}
    .msg-terminal{
      margin:0; padding:10px 12px; background:#0f172a; color:#cbd5e1;
      border-top:1px solid #1e293b; font-size:11px; line-height:1.55;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap;
    }
    .ai-foot{
      border-top:1px solid #e2e8f0; padding:10px 12px; background:rgba(255,255,255,.82);
    }
    .ai-chips-row{
      display:flex; gap:8px; overflow-x:auto; white-space:nowrap; padding-bottom:8px;
      scrollbar-width:thin;
    }
    .ai-chip-btn{
      border:1px solid #d2ddea; background:#f8fbff; color:#334155;
      border-radius:999px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer;
      flex:0 0 auto;
    }
    .ai-input-wrap{
      display:flex;
      align-items:flex-end;
      gap:8px;
      border:1px solid #d8e2ed;
      border-radius:16px;
      background:#ffffff;
      color:#1f2f46;
      min-height:52px;
      padding:6px 8px;
      box-shadow:0 4px 10px rgba(15,23,42,.06);
    }
    .ai-input-wrap.drop-active{
      box-shadow:0 0 0 3px rgba(59,130,246,.18) inset;
      background:rgba(239,246,255,.65);
    }
    .ai-input-actions-left,.ai-input-actions-right{
      display:flex; align-items:center; gap:6px; flex:0 0 auto;
    }
    .ai-upload-btn{
      border:1px solid transparent; background:transparent; color:#334155;
      border-radius:10px; padding:6px 8px; font-size:14px; font-weight:700; cursor:pointer;
    }
    .ai-upload-btn:hover{ background:#f1f5f9; border-color:#d2ddea; }
    .ai-voice-btn{
      border:1px solid transparent; background:transparent; color:#334155;
      border-radius:10px; padding:6px 8px; font-size:14px; font-weight:700; cursor:pointer;
    }
    .ai-voice-btn:hover{ background:#f1f5f9; border-color:#d2ddea; }
    .ai-voice-btn.listening{
      border-color:#ef4444; color:#b91c1c; background:#fff1f2;
    }
    .ai-voice-toggle{
      border:1px solid #d2ddea; background:#f8fbff; color:#334155;
      border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700; cursor:pointer;
    }
    .ai-voice-toggle.loop-on{
      border-color:#10b981; color:#065f46; background:#ecfdf5;
    }
    .ai-voice-rate{
      border:1px solid #d2ddea; background:#fff; color:#334155;
      border-radius:999px; padding:4px 8px; font-size:12px; font-weight:700; cursor:pointer; height:28px;
    }
    .ai-upload-pill{
      border:1px solid #d7e0eb; background:#f8fafc; color:#334155;
      border-radius:999px; padding:4px 10px; font-size:11px; display:none; align-items:center; gap:6px;
    }
    .ai-upload-thumb{
      width:18px; height:18px; border-radius:6px; object-fit:cover; border:1px solid #cbd5e1; background:#fff;
      display:none;
    }
    .ai-upload-pill button{
      border:none; background:transparent; color:#64748b; cursor:pointer; font-size:12px; line-height:1;
    }
    #aiCmdInput{
      width:100%;
      flex:1 1 auto;
      box-sizing:border-box;
      border:none;
      border-radius:10px;
      background:transparent;
      color:#1f2f46;
      padding:10px 6px;
      height:52px;
      font-size:15px;
    }
    #aiCmdInput:focus{
      outline:none;
      box-shadow:none;
    }
    .ai-meta{font-size:11px;color:#64748b;}
    .ai-chip{display:inline-block;border:1px solid #d2ddea;background:#f7fbff;color:#304a62;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;}
    .ai-rich-card{
      margin-top:8px; border:1px solid #dbe3ee; border-radius:10px; background:#f8fafc; padding:10px;
    }
    .ai-rich-title{font-size:12px; font-weight:800; color:#334155; margin-bottom:6px;}
    .ai-rich-body{font-size:13px; color:#334155; line-height:1.5;}
    .ai-rich-actions{margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;}
    .ai-rich-btn{
      border:1px solid #c7d6e6; background:#ffffff; color:#0f172a;
      border-radius:8px; padding:5px 9px; font-size:12px; font-weight:700; text-decoration:none;
    }
    .ai-toast-wrap{
      position:fixed; right:14px; top:14px; z-index:10005; display:flex; flex-direction:column; gap:8px; max-width:360px;
    }
    .ai-toast{
      border:1px solid #d7e0eb; background:#fff; border-radius:10px; padding:9px 10px; font-size:12px; color:#1f2f46;
      box-shadow:0 8px 20px rgba(15,23,42,.14);
    }
    .ai-toast .undo{margin-left:8px; border:none; background:transparent; color:#0f766e; text-decoration:underline; cursor:pointer; font-size:12px; padding:0;}
    .msg-ai.alert .bubble{border-left:4px solid #f59e0b;}
    .msg-ai.question .bubble{border-left:4px solid #3b82f6;}
    .msg-ai.action .bubble{border-left:4px solid #10b981;}
    .iv-controls{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
    .iv-btn{border:1px solid #d2ddea; background:#fff; color:#334155; border-radius:999px; padding:4px 9px; font-size:11px; cursor:pointer;}
    .task-cards{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
    .task-card{
      background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:10px;
      box-shadow:0 1px 3px rgba(15,23,42,.08); display:flex; align-items:flex-start; gap:8px;
      transition:opacity .22s ease, transform .22s ease;
    }
    .task-card.done{opacity:.45; transform:translateY(-2px);}
    .rec-controls{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
    .rec-btn{
      border:1px solid #d4dee9; background:#fff; color:#0f172a;
      border-radius:10px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer;
    }
    .rec-btn:hover{background:#f8fafc;}
    .task-icon{
      font-size:14px; line-height:1.2; color:#64748b; margin-top:1px;
      border:1px solid #cbd5e1; border-radius:6px; background:#fff; cursor:pointer; width:22px; height:22px;
      display:inline-flex; align-items:center; justify-content:center; padding:0;
    }
    .task-main{font-size:13px; color:#0f172a; line-height:1.35;}
    .task-main p{margin:0;}
    .task-due{font-size:11px; color:#64748b; margin-top:2px;}
    #aiSendBtn{height:38px; min-width:72px; border-radius:999px; font-size:12px; padding:0 12px; flex:0 0 auto;}
    .ai-open {
      position:fixed;
      right:14px;
      bottom:14px;
      z-index:10002;
      border:1px solid #dbe4ee;
      background:#fff;
      color:#1f2f46;
      border-radius:999px;
      padding:10px 12px;
      font-size:12px;
      font-weight:800;
      box-shadow:0 8px 18px rgba(15,23,42,.15);
      cursor:pointer;
    }
    .ai-worker-badge{
      position:fixed;
      right:14px;
      bottom:62px;
      z-index:10002;
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:1px solid #dbe4ee;
      background:#fff;
      color:#1f2f46;
      border-radius:999px;
      padding:6px 10px;
      font-size:11px;
      font-weight:800;
      line-height:1;
      box-shadow:0 6px 14px rgba(15,23,42,.12);
      user-select:none;
    }
    .ai-worker-dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:#94a3b8;
      border:1px solid rgba(15,23,42,.1);
      flex:0 0 auto;
    }
    .ai-worker-badge.ok .ai-worker-dot{ background:#10b981; }
    .ai-worker-badge.busy .ai-worker-dot{ background:#f59e0b; }
    .ai-worker-badge.degraded .ai-worker-dot{ background:#fb7185; }
    .ai-worker-badge.down .ai-worker-dot{ background:#ef4444; }
    .ai-ghost{
      position:fixed;
      right:18px;
      top:14px;
      width:10px;height:10px;border-radius:999px;
      z-index:10003;
      opacity:0;
      box-shadow:0 0 0 0 rgba(16,185,129,.55);
      transition:opacity .12s ease;
    }
    .ai-ghost.show{opacity:1;}
    .ai-ghost.idle{background:#94a3b8;}
    .ai-ghost.thinking{background:#10b981;animation:aiPulse 1.2s infinite;}
    .ai-ghost.running{background:#f59e0b;animation:aiPulse 1s infinite;}
    .ai-ghost.done{background:#10b981;}
    .ai-ghost.failed{background:#f43f5e;}
    @keyframes aiPulse{
      0%{ box-shadow:0 0 0 0 rgba(16,185,129,.55); }
      70%{ box-shadow:0 0 0 8px rgba(16,185,129,0); }
      100%{ box-shadow:0 0 0 0 rgba(16,185,129,0); }
    }
    @media (prefers-reduced-motion: reduce){
      .ai-ghost{animation:none !important;}
    }
    @media (max-width:780px){
      #cmdkCard{
        margin:10px;
        border-radius:14px;
        width:calc(100vw - 20px);
        height:calc(100vh - 20px);
        min-width:0;
        min-height:0;
        left:10px;
        top:10px;
        transform:none;
        resize:none;
      }
    }
    .section-title{margin:0 0 8px 0;font-size:18px;letter-spacing:.01em;}
    .subtle{font-size:12px;color:var(--muted);}
    @media (min-width:1020px) { .grid { grid-template-columns:1fr 1fr; } .grid3{grid-template-columns:1fr 1fr 1fr;} }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="global-shell">
    <aside class="global-nav">
      <h3 class="global-brand">Investor OS v2</h3>
      <a class="global-link" href="/dashboard" data-nav="dashboard"><span class="global-link-label">Dashboard</span></a>
      <a class="global-link" href="/my_universe" data-nav="universe"><span class="global-link-label">Portfolio / Universe</span></a>
      <a class="global-link" href="/company_file" data-nav="company"><span class="global-link-label">Company Search</span></a>
      <a class="global-link" href="/organizer" data-nav="organizer"><span class="global-link-label">Organizer</span></a>
      <a class="global-link" href="/observability" data-nav="settings"><span class="global-link-label">Settings</span></a>
      <div class="global-search-wrap">
        <input id="globalSearchInput" class="global-search-input" type="text" autocomplete="off" placeholder="Search app, companies, tasks, notes, reports...">

      function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
      function defaultGeom(){
        var w = Math.min(800, window.innerWidth - 28);
        var h = Math.min(920, Math.floor(window.innerHeight * 0.80));
        var l = Math.floor((window.innerWidth - w)/2);
        var t = Math.max(10, Math.floor(window.innerHeight * 0.08));
        return {left:l, top:t, width:w, height:h};
      }
      function applyGeom(g){
        if(!card || !g) return;
        var width = clamp(Number(g.width||720), 360, window.innerWidth - 12);
        var height = clamp(Number(g.height||620), 260, window.innerHeight - 12);
        var left = clamp(Number(g.left||20), 6, window.innerWidth - width - 6);
        var top = clamp(Number(g.top||20), 6, window.innerHeight - height - 6);
        card.style.transform='none';
        card.style.left = left + 'px';
        card.style.top = top + 'px';
        card.style.width = width + 'px';
        card.style.height = height + 'px';
      }
      function saveGeom(){
        if(!card) return;
        var r = card.getBoundingClientRect();
        var g = {left: Math.round(r.left), top: Math.round(r.top), width: Math.round(r.width), height: Math.round(r.height)};
        try{ localStorage.setItem(geomKey, JSON.stringify(g)); }catch(_e){}
      }
      function loadGeom(){
        if(!card) return;
        try{
          var raw = localStorage.getItem(geomKey);
          if(raw){ applyGeom(JSON.parse(raw)); return; }
        }catch(_e){}
        applyGeom(defaultGeom());
      }
      function loadState(){
        try{
          if(localStorage.getItem(uiMigrateKey) !== '1'){
            localStorage.removeItem(threadKey);

            localStorage.setItem(uiMigrateKey, '1');

        }catch(_e){}
        try{
          aiThread = JSON.parse(localStorage.getItem(threadKey) || '[]');
          if(!Array.isArray(aiThread)){ aiThread=[]; }
        }catch(_e){ aiThread=[]; }
        // Do not persist pending_query across sessions/refreshes; it can hijack new commands.
        pendingQuery = '';
        interviewPending = false;
        userPrefs = String(localStorage.getItem(prefsKey) || '');
        try{
          if(!localStorage.getItem(sessionKey)){
            localStorage.setItem(sessionKey, 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,10));
          }
        }catch(_e){}
      }
      function saveState(){
        try{ localStorage.setItem(threadKey, JSON.stringify(aiThread.slice(-40))); }catch(_e){}
        // Keep pending_query in-memory only for immediate clarification turn.
        try{ localStorage.removeItem(pendingKey); }catch(_e){}
        try{ localStorage.setItem(prefsKey, userPrefs || ''); }catch(_e){}
        try{
          localStorage.setItem(
            voicePrefsKey,
            JSON.stringify({autoReadAloud: !!autoReadAloud, voiceLoopEnabled: !!voiceLoopEnabled, rate: Number(voiceRate || 1.0)})
          );
        }catch(_e){}
      }
      function loadVoicePrefs(){
        // Voice read-aloud and loop are temporarily disabled.
        autoReadAloud = false;
        voiceLoopEnabled = false;
        try{
          var raw = localStorage.getItem(voicePrefsKey) || '';
          if(!raw){ return; }
          var v = JSON.parse(raw);
          var r = Number(v && v.rate);
          if(isFinite(r) && r >= 0.7 && r <= 1.6){ voiceRate = r; }
        }catch(_e){}
      }
      function updateVoiceUi(){
        if(speakToggleBtn){
          speakToggleBtn.textContent = 'Read Aloud: ' + (autoReadAloud ? 'On' : 'Off');
        }
        if(voiceLoopToggleBtn){
          voiceLoopToggleBtn.textContent = 'Voice Loop: ' + (voiceLoopEnabled ? 'On' : 'Off');
          voiceLoopToggleBtn.classList.toggle('loop-on', !!voiceLoopEnabled);
        }
        if(voiceRateSel){
          var target = String(Number(voiceRate || 1.0).toFixed(2));
          var matched = false;
          for(var i=0;i<voiceRateSel.options.length;i++){
            var opt = String(Number(voiceRateSel.options[i].value || '1.0').toFixed(2));
            if(opt === target){ voiceRateSel.selectedIndex = i; matched = true; break; }
          }
          if(!matched){ voiceRateSel.value = '1.0'; voiceRate = 1.0; }
        }
        if(voiceBtn){
          voiceBtn.classList.toggle('listening', !!listening);
          voiceBtn.textContent = listening ? 'Listening...' : 'Mic';
        }
      }
      function stopSpeaking(){
        try{
          if(window.speechSynthesis){ window.speechSynthesis.cancel(); }
        }catch(_e){}
      }
      function maybeResumeVoiceLoop(delayMs){
        return;
      }
      function scheduleVoiceSubmit(){
        if(voiceSubmitTimer){ clearTimeout(voiceSubmitTimer); voiceSubmitTimer = null; }
        voiceSubmitTimer = setTimeout(function(){
          voiceSubmitTimer = null;
          if(!voiceLoopEnabled || voiceSubmitting || awaitingAssistant || !form || !input){ return; }
          var q = String(input.value || '').trim();
          if(!q){ maybeResumeVoiceLoop(220); return; }
          voiceSubmitting = true;
          try{ form.requestSubmit(); }catch(_e){ voiceSubmitting = false; maybeResumeVoiceLoop(220); }
        }, 220);
      }
      function speakText(text, onDone){
        if(!autoReadAloud){ return; }
        var raw = String(text || '').trim();
        if(!raw){ return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance){
          showToast('Read-aloud is not supported in this browser.');
          return;
        }
        stopSpeaking();
        var u = new SpeechSynthesisUtterance(raw.replace(/\s+/g, ' ').slice(0, 1800));
        u.rate = Number(voiceRate || 1.0);
        u.pitch = 1.0;
        u.volume = 1.0;
        u.onend = function(){ if(typeof onDone === 'function'){ try{ onDone(); }catch(_e){} } };
        u.onerror = function(){ if(typeof onDone === 'function'){ try{ onDone(); }catch(_e){} } };
        try{ window.speechSynthesis.speak(u); }catch(_e){}
      }
      function initSpeechRecognition(){
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR){ return; }
        try{
          recognition = new SR();
          recognition.continuous = false;
          recognition.interimResults = true;
          recognition.lang = 'en-US';
          recognition.onstart = function(){
            stopSpeaking(); // barge-in: user speech interrupts assistant speech
            listening = true;
            updateVoiceUi();
            showToast('Listening...');
          };
          recognition.onend = function(){
            listening = false;
            updateVoiceUi();
          };
          recognition.onerror = function(){
            listening = false;
            updateVoiceUi();
            showToast('Voice input failed.');
          };
          recognition.onresult = function(ev){
            var finalTxt = '';
            var interimTxt = '';
            for(var i = ev.resultIndex; i < ev.results.length; i++){
              var part = String(((ev.results[i]||[])[0]||{}).transcript || '');
              if(ev.results[i].isFinal){ finalTxt += part + ' '; }
              else { interimTxt += part + ' '; }
            }
            var spoken = String(finalTxt || interimTxt).trim();
            if(spoken && input){
              var prefix = String(input.value || '').trim();
              input.value = (prefix ? (prefix + ' ') : '') + spoken;
              if(finalTxt && voiceLoopEnabled){
                scheduleVoiceSubmit();
              }
            }
          };
        }catch(_e){
          recognition = null;
        }
      }
      function toggleListening(){
        if(!recognition){
          showToast('Voice input is not supported in this browser.');
          return;

        try{
          if(listening){ recognition.stop(); return; }
          stopSpeaking();
          recognition.start();
        }catch(_e){
          listening = false;
          updateVoiceUi();
          showToast('Could not start microphone.');
        }
      }

      function esc(s){
        return String(s||'').replace(/[&<>\"']/g, function(ch){
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch] || ch;

      function showToast(text, opts){
        if(!toastWrap){ return; }
        var t = document.createElement('div');
        t.className = 'ai-toast';
        var msg = document.createElement('span');
        msg.textContent = String(text || '');

        if(opts && typeof opts.onUndo === 'function'){
          var u = document.createElement('button');

          });
          t.appendChild(u);

        toastWrap.appendChild(t);

      }
      function clearGlobalSearch(){
        globalSearchItems = [];
        globalSearchIndex = -1;
        if(globalSearchResults){
          globalSearchResults.innerHTML = '';
          globalSearchResults.style.display = 'none';

      }
      function renderGlobalSearch(items){
        globalSearchItems = Array.isArray(items) ? items : [];
        globalSearchIndex = -1;
        if(!globalSearchResults){ return; }
        if(!globalSearchItems.length){
          clearGlobalSearch();
          return;
        }
        globalSearchResults.innerHTML = globalSearchItems.map(function(it, idx){
          var title = esc(String(it.title || '-'));
          var sub = esc(String(it.subtitle || ''));
          var kind = esc(String(it.kind || 'result'));
          var url = esc(String(it.url || '#'));
          return '<a href="' + url + '" class="global-search-row" data-gs-index="' + idx + '">' +
            '<div class="global-search-title">' + title + '</div>' +
            (sub ? '<div class="global-search-sub">' + sub + '</div>' : '') +

          '</a>';

      async function runGlobalSearch(q){
        var query = String(q || '').trim();
        if(query.length < 2){
          clearGlobalSearch();
          return;
        }
        function fallbackItems(text){
          var x = String(text || '').trim();
          var enc = encodeURIComponent(x);
          var out = [
            { kind: 'company', title: 'Search companies: ' + x, subtitle: 'Open company search', url: '/company_file?q=' + enc },
            { kind: 'report', title: 'Search reports: ' + x, subtitle: 'Open reports', url: '/reports?q=' + enc },
            { kind: 'note', title: 'Search notes/tasks: ' + x, subtitle: 'Open organizer', url: '/organizer?q=' + enc }
          ];
          var upper = x.toUpperCase();
          var tkMatch = upper.match(/\b[A-Z]{1,5}\b/);
          if (tkMatch && tkMatch[0]) {
            out.unshift({
              kind: 'filing',
              title: tkMatch[0] + ' SEC filings',
              subtitle: 'Open company SEC filings',
              url: '/company_file/sec?t=' + encodeURIComponent(tkMatch[0])
            });
          }
          return out;
        }
        try{
          var res = await fetch('/api/global-search?q=' + encodeURIComponent(query) + '&limit=12', {method:'GET'});
          if(!res.ok){
            renderGlobalSearch(fallbackItems(query));
            return;
          }
          var data = await res.json();
          var rows = (data && data.results) || [];
          if(!rows.length){
            renderGlobalSearch(fallbackItems(query));
            return;
          }
          renderGlobalSearch(rows);
        }catch(_e){
          renderGlobalSearch(fallbackItems(query));
        }
      }
      function classifyKind(m){
        var it = String((m && m.intent) || '').toLowerCase();
        var st = String((m && m.status) || '').toLowerCase();
        if(it === 'portfolio_interview' || st === 'needs_input'){ return 'question'; }
        if(it.indexOf('alert') >= 0 || it === 'proactive_gap_check'){ return 'alert'; }
        if(it === 'add_task' || it === 'add_note_draft' || it === 'save_thesis' || it === 'add_daily_log' || it === 'backfill_trade_history'){ return 'action'; }
        return 'normal';
      }
      function statusLabel(m){
        var st = String((m && m.status) || '').toLowerCase();
        var traces = Array.isArray(m && m.traces) ? m.traces : [];
        if(st === 'needs_input' || st === 'needs_confirmation' || st === 'needs_clarification'){ return '⚪ Waiting for your input'; }
        if(st === 'error'){ return '⚠ Could not complete'; }
        if(traces.length){ return traces.length + ' steps completed'; }
        return '✓ Completed';
      }
      function traceToCommand(t){
        var cmd = String((t && t.command) || '').trim();
        if(cmd){ return '> ' + cmd; }
        var step = String((t && t.step) || '').trim().replace(/\s+/g, '_').toLowerCase();
        var detail = String((t && t.detail) || '').trim();
        if(step && detail){ return '> invest_app ' + step + ' -- ' + detail; }
        if(step){ return '> invest_app ' + step; }
        if(detail){ return '> ' + detail; }
        return '> step';
      }
      function renderAuditTrail(m, sid, label){
        var traces = Array.isArray(m && m.traces) ? m.traces : [];
        if(!traces.length){ return ''; }
        var lbl = String(label || statusLabel(m));
        var body = traces.map(traceToCommand).join('\n');
        return '<details class="msg-audit" id="' + esc(sid) + '"><summary>' + esc(lbl) + '</summary><pre class="msg-terminal">' + esc(body) + '</pre></details>';

      function colorizeFinancialMetrics(html){
        var out = String(html || '');
        out = out.replace(/(^|[>\s(])(\+\d[\d,]*(?:\.\d+)?%)/g, '$1<span class="num-pos">$2</span>');
        out = out.replace(/(^|[>\s(])(-\d[\d,]*(?:\.\d+)?%)/g, '$1<span class="num-neg">$2</span>');
        out = out.replace(/(^|[>\s(])(\+\$?\d[\d,]*(?:\.\d+)?)/g, '$1<span class="num-pos">$2</span>');
        out = out.replace(/(^|[>\s(])(-\$?\d[\d,]*(?:\.\d+)?)/g, '$1<span class="num-neg">$2</span>');
        return out;
      }
      function renderMarkdown(text){
        var raw = String(text || '');
        if(window.marked && typeof window.marked.parse === 'function'){
          try{
            var safeRaw = raw.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return colorizeFinancialMetrics(window.marked.parse(safeRaw, {gfm:true, breaks:true, headerIds:false, mangle:false}));
          }catch(_mdErr){}
        }
        var safe = esc(raw);
        // bold + inline code
        safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
        var lines = safe.split(/\r?\n/);
        var out = [];
        var inUl = false, inOl = false;
        function closeLists(){
          if(inUl){ out.push('</ul>'); inUl=false; }
          if(inOl){ out.push('</ol>'); inOl=false; }
        }
        lines.forEach(function(line){
          var s = String(line || '').trim();
          if(!s){ closeLists(); return; }
          var h = s.match(/^(#{1,3})\s+(.+)/);
          if(h){
            closeLists();
            var lvl = Math.min(3, h[1].length);
            out.push('<h'+lvl+'>'+h[2]+'</h'+lvl+'>');
            return;
          }
          var ul = s.match(/^[-*]\s+(.+)/);
          if(ul){
            if(inOl){ out.push('</ol>'); inOl=false; }
            if(!inUl){ out.push('<ul>'); inUl=true; }
            out.push('<li>'+ul[1]+'</li>');
            return;
          }
          var ol = s.match(/^\d+\.\s+(.+)/);
          if(ol){
            if(inUl){ out.push('</ul>'); inUl=false; }
            if(!inOl){ out.push('<ol>'); inOl=true; }
            out.push('<li>'+ol[1]+'</li>');
            return;
          }
          closeLists();
          out.push('<p>'+s+'</p>');
        });
        closeLists();
        return colorizeFinancialMetrics(out.join(''));
      }
      function splitTaskLines(text){
        var raw = String(text || '');
        var normalized = raw
          .replace(/\s+\*\s+/g, '\n* ')
          .replace(/\s+•\s+/g, '\n• ')
          .replace(/\s+☐\s+/g, '\n☐ ')
          .replace(/\s+□\s+/g, '\n□ ');
        var lines = normalized.split(/\r?\n/);
        var items = [];
        var keep = [];
        var markerRe = /^(?:[-*•]\s+|\d+\.\s+|\[\s?\]\s*|☐\s*|□\s*)/;
        lines.forEach(function(line){
          var s = String(line || '').trim();
          if(!s){ keep.push(line); return; }
          if(!markerRe.test(s)){ keep.push(line); return; }
          var content = s.replace(markerRe, '').trim();
          if(!content){ return; }
          var due = '';
          var mParen = content.match(/\((?:due|by)\s*[:\-]?\s*([^)]+)\)\s*$/i);
          if(mParen){
            due = String(mParen[1] || '').trim();
            content = content.slice(0, mParen.index).trim();
          } else {
            var mTail = content.match(/\s+(?:due|by)\s+(.+)$/i);
            if(mTail){
              due = String(mTail[1] || '').trim();
              content = content.slice(0, mTail.index).trim();
            }
          }
          var todoId = '';
          var idMatch = content.match(/\s+\[#?(\d{1,10})\]\s*$/);
          if(idMatch){
            todoId = String(idMatch[1] || '').trim();
            content = content.slice(0, idMatch.index).trim();
          }
          if(content){
            items.push({task: content, due: due, todo_id: todoId});
          }
        });
        return {items: items, nonTaskText: keep.join('\n').trim()};
      }

        if(parsed.nonTaskText){

        }
        return html;
      }

              traces:[],
              citations:[],
              redirect_url:'',
              _id: Date.now()+2
            });
            renderThread();
            setState('failed');
            maybeResumeVoiceLoop(260);
            return;
          }
        });
      }
      if(globalSearchInput){
        globalSearchInput.addEventListener('input', function(){
          if(globalSearchTimer){ clearTimeout(globalSearchTimer); globalSearchTimer = null; }
          var q = String(globalSearchInput.value || '');
          globalSearchTimer = setTimeout(function(){ runGlobalSearch(q); }, 120);
        });
        globalSearchInput.addEventListener('keydown', function(e){
          if(!globalSearchItems.length){
            if(e.key === 'Escape'){ clearGlobalSearch(); globalSearchInput.blur(); }
            return;
          }
          if(e.key === 'ArrowDown'){
            e.preventDefault();
            globalSearchIndex = Math.min(globalSearchItems.length - 1, globalSearchIndex + 1);
            highlightGlobalSearch();
            return;
          }
          if(e.key === 'ArrowUp'){
            e.preventDefault();
            globalSearchIndex = Math.max(0, globalSearchIndex - 1);
            highlightGlobalSearch();
            return;
          }
          if(e.key === 'Enter'){
            if(globalSearchIndex >= 0 && globalSearchIndex < globalSearchItems.length){
              e.preventDefault();
              var url = String((globalSearchItems[globalSearchIndex] || {}).url || '');
              if(url){ window.location.assign(url); }
              return;
            }
          }
          if(e.key === 'Escape'){
            clearGlobalSearch();
            globalSearchInput.blur();
          }
        });
        document.addEventListener('click', function(ev){
          var target = ev.target;
          if(!target){ return; }
          if(globalSearchInput.contains(target) || (globalSearchResults && globalSearchResults.contains(target))){
            return;
          }
          clearGlobalSearch();
        });
      }
      applyThemePref();
      applySidebarPref();
      loadState();
      loadVoicePrefs();
      initSpeechRecognition();
      updateVoiceUi();
      maybeInjectMorningBrief();
      pollProactiveBadge().finally(function(){ scheduleProactivePoll(proactivePollMs); });
      pollWorkerHealth().finally(function(){ scheduleWorkerHealthPoll(workerHealthPollMs); });
      document.addEventListener('visibilitychange', function(){
        if(document.hidden){
          try { if(proactivePollTimer){ clearTimeout(proactivePollTimer); proactivePollTimer = null; } } catch(_e) {}
          try { if(workerHealthPollTimer){ clearTimeout(workerHealthPollTimer); workerHealthPollTimer = null; } } catch(_e) {}
          stopPhase2Poll();
          return;
        }
        pollProactiveBadge().finally(function(){ scheduleProactivePoll(8000); });
        pollWorkerHealth().finally(function(){ scheduleWorkerHealthPoll(5000); });
        if(phase2ReducerId){ phase2PollLoop(700); }
      });
      if(ghost){ ghost.className='ai-ghost show idle'; }
      try{
        var p = String(window.location.pathname || '');
        var key = 'dashboard';
        if(p.indexOf('/my_universe') === 0){ key = 'universe'; }
        else if(p.indexOf('/company_file') === 0){ key = 'company'; }
        else if(p.indexOf('/organizer') === 0){ key = 'organizer'; }
        else if(p.indexOf('/observability') === 0){ key = 'settings'; }
        document.querySelectorAll('.global-link').forEach(function(el){
          el.classList.toggle('active', String(el.getAttribute('data-nav') || '') === key);
        });
      }catch(_e){}
    })();
  </script>
</body>
</html>
