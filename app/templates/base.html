<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Investor OS v2{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root{
      --bg:#eaf0f4;
      --panel:#f1f5f8;
      --panel2:#edf2f6;
      --border:#d6dee6;
      --border2:#c8d3dd;
      --text:#2f4358;
      --muted:#4f6780;
      --accent:#ff7a59;
      --accent-ink:#b5472f;
      --glass-bg:rgba(255,255,255,.72);
      --glass-border:rgba(255,255,255,.5);
      --glass-blur:14px;
      --glass-shadow:0 20px 56px rgba(15,23,42,.24);
      --glass-opacity:.94;
    }
    body { margin:0; background:var(--bg); color:var(--text); font-family:"Avenir Next","Helvetica Neue",sans-serif; }
    .wrap {
      width:100%;
      max-width:1920px;
      margin:0 auto;
      padding:24px;
      box-sizing:border-box;
    }
    @media (max-width:900px) {
      .wrap { padding:14px; }
    }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; }
    .topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .title{font-weight:800;letter-spacing:.01em;}
    .btn { border:1px solid var(--border2); background:var(--panel2); color:var(--text); border-radius:8px; padding:6px 10px; text-decoration:none; font-size:12px; font-weight:700; cursor:pointer; }
    input, textarea, select { width:100%; box-sizing:border-box; border:1px solid #c8d3dd; border-radius:8px; background:#edf2f6; color:#2f4358; padding:8px; }
    button { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:8px; padding:8px 10px; font-weight:700; cursor:pointer; }
    table { width:100%; border-collapse:collapse; }
    th, td { border-bottom:1px solid #d6dee6; padding:8px; text-align:left; vertical-align:top; }
    .muted { color:var(--muted); }
    .flash { margin-bottom:10px; padding:8px; border:1px solid #9fbad0; border-radius:8px; background:#edf2f6; }
    .grid { display:grid; grid-template-columns:1fr; gap:10px; }
    .grid3 { display:grid; grid-template-columns:1fr; gap:10px; }
    .stats { display:flex; gap:8px; flex-wrap:wrap; }
    .chip { padding:4px 10px; border-radius:999px; border:1px solid #c8d3dd; background:#edf2f6; font-size:12px; font-weight:700; }
    .kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:2px 6px;border:1px solid var(--border2);border-radius:6px;background:var(--panel2);}
    #cmdkOverlay{
      display:none;position:fixed;inset:0;background:rgba(15,23,42,.26);z-index:10000;
      backdrop-filter: blur(2px);
    }
    #cmdkCard{
      max-width:94vw;
      width:min(800px, calc(100vw - 28px));
      height:min(80vh, 920px);
      background:rgba(255,255,255,.85);
      border:1px solid var(--glass-border);
      border-radius:18px;
      padding:0;
      box-shadow:var(--glass-shadow);
      backdrop-filter: blur(12px);
      opacity:var(--glass-opacity);
      display:flex;
      flex-direction:column;
      position:fixed;
      left:50%;
      top:8vh;
      transform:translateX(-50%);
      resize:both;
      overflow:hidden;
      min-width:520px;
      min-height:420px;
    }
    #cmdkDragBar{ cursor:move; user-select:none; }
    .ai-head{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 14px; border-bottom:1px solid #e2e8f0; background:rgba(255,255,255,.7);
    }
    .ai-title{font-weight:800; font-size:14px; letter-spacing:.01em;}
    .ai-actions{display:flex; gap:6px; align-items:center;}
    .ai-icon-btn{
      border:1px solid #cbd5e1; background:#f8fafc; color:#334155;
      border-radius:8px; padding:4px 7px; font-weight:700; font-size:12px;
    }
    .ai-empty{
      height:100%; display:flex; align-items:center; justify-content:center;
      color:#64748b; font-size:20px; font-weight:700; text-align:center; padding:20px;
    }
    .ai-body{flex:1; min-height:0; display:flex; flex-direction:column;}
    .ai-history{
      flex:1; overflow-y:auto; padding:14px; background:rgba(248,250,252,.8);
    }
    .msg-row{display:flex; margin:10px 0;}
    .msg-user{justify-content:flex-end;}
    .msg-ai{justify-content:flex-start;}
    .msg-user .bubble{
      max-width:78%; background:#f1f5f9; color:#0f172a;
      border-radius:16px 6px 16px 16px; padding:10px 12px;
      font-size:15px; line-height:1.55;
      border:1px solid #e2e8f0;
    }
    .msg-ai .bubble{
      max-width:86%; background:#ffffff; color:#0f172a;
      border-radius:12px; padding:10px 12px; border:none;
      font-size:15px; line-height:1.6;
    }
    .msg-avatar{
      width:22px; height:22px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center;
      font-size:12px; margin-right:8px; margin-top:4px; background:#e2e8f0; color:#334155;
    }
    .md p{margin:0 0 8px 0;}
    .md p:last-child{margin-bottom:0;}
    .md ul,.md ol{margin:6px 0 8px 18px; padding:0;}
    .md li{margin:3px 0;}
    .md h1,.md h2,.md h3{margin:8px 0 6px 0; font-size:16px; line-height:1.3;}
    .msg-meta{
      margin-top:8px; font-size:11px; color:#64748b;
    }
    .msg-status{margin-top:8px; font-size:10px; color:#9aa7b8; display:flex; gap:8px; align-items:center;}
    .msg-status .status-link{
      color:#8aa0b8; cursor:pointer; border:1px solid #d7e1eb; background:#fff; padding:0;
      font-size:11px; width:18px; height:18px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center;
    }
    .msg-status .status-link:hover{color:#5f7892; border-color:#c8d6e4;}
    .msg-logs{
      margin-top:6px; border:1px solid #d7dee8; border-radius:10px; background:#f8fafc; padding:8px;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; line-height:1.45; color:#334155;
    }
    .traces{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
    .trace-chip{
      border:1px solid #d5deea; background:#fff; color:#475569; border-radius:999px; padding:2px 8px; font-size:10px;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    .ai-foot{
      border-top:1px solid #e2e8f0; padding:10px 12px; background:rgba(255,255,255,.82);
      backdrop-filter: blur(8px);
    }
    .ai-chips-row{
      display:flex; gap:8px; overflow-x:auto; white-space:nowrap; padding-bottom:8px;
      scrollbar-width:thin;
    }
    .ai-chip-btn{
      border:1px solid #d2ddea; background:#f8fbff; color:#334155;
      border-radius:999px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer;
      flex:0 0 auto;
    }
    .ai-input-wrap{position:relative;}
    .ai-input-wrap.drop-active{
      border-radius:14px;
      box-shadow:0 0 0 3px rgba(59,130,246,.18) inset;
      background:rgba(239,246,255,.65);
    }
    .ai-input-tools{display:flex; gap:8px; margin-top:8px; align-items:center;}
    .ai-upload-btn{
      border:1px solid #d2ddea; background:#fff; color:#334155;
      border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700; cursor:pointer;
    }
    .ai-voice-btn{
      border:1px solid #d2ddea; background:#fff; color:#334155;
      border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700; cursor:pointer;
    }
    .ai-voice-btn.listening{
      border-color:#ef4444; color:#b91c1c; background:#fff1f2;
    }
    .ai-voice-toggle{
      border:1px solid #d2ddea; background:#f8fbff; color:#334155;
      border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700; cursor:pointer;
    }
    .ai-voice-toggle.loop-on{
      border-color:#10b981; color:#065f46; background:#ecfdf5;
    }
    .ai-voice-rate{
      border:1px solid #d2ddea; background:#fff; color:#334155;
      border-radius:999px; padding:4px 8px; font-size:12px; font-weight:700; cursor:pointer; height:28px;
    }
    .ai-upload-pill{
      border:1px solid #d7e0eb; background:#f8fafc; color:#334155;
      border-radius:999px; padding:4px 10px; font-size:11px; display:none; align-items:center; gap:6px;
    }
    .ai-upload-thumb{
      width:18px; height:18px; border-radius:6px; object-fit:cover; border:1px solid #cbd5e1; background:#fff;
      display:none;
    }
    .ai-upload-pill button{
      border:none; background:transparent; color:#64748b; cursor:pointer; font-size:12px; line-height:1;
    }
    #aiCmdInput{
      width:100%;
      box-sizing:border-box;
      border:1px solid #d8e2ed;
      border-radius:999px;
      background:#ffffff;
      color:#1f2f46;
      padding:13px 110px 13px 16px;
      height:52px;
      font-size:15px;
      box-shadow:0 10px 24px rgba(15,23,42,.08);
    }
    #aiCmdInput:focus{
      outline:none;
      border-color:#89a8c7;
      box-shadow:0 0 0 3px rgba(59,130,246,.12);
    }
    .ai-meta{font-size:11px;color:#64748b;}
    .ai-phase2{
      margin-top:8px;
      border:1px solid #dbe4ee;
      border-radius:12px;
      background:#f8fafc;
      padding:8px;
      display:grid;
      gap:6px;
    }
    .ai-phase2-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      flex-wrap:wrap;
    }
    .ai-phase2-title{
      font-size:11px;
      font-weight:800;
      color:#334155;
      letter-spacing:.03em;
      text-transform:uppercase;
    }
    .ai-phase2-status{
      font-size:11px;
      color:#334155;
      font-weight:700;
    }
    .ai-phase2-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:6px;
    }
    .ai-phase2-grid input{
      height:32px;
      font-size:12px;
      padding:6px 10px;
      border-radius:9px;
      background:#fff;
    }
    .ai-phase2-run{
      border:1px solid #d2ddea;
      background:#fff;
      color:#1f2f46;
      border-radius:9px;
      font-size:12px;
      font-weight:800;
      padding:6px 10px;
      cursor:pointer;
    }
    .ai-phase2-run[disabled]{ opacity:.65; cursor:not-allowed; }
    .ai-phase2-progress{
      font-size:11px;
      color:#475569;
      line-height:1.3;
      min-height:14px;
    }
    @media (max-width:780px){
      .ai-phase2-grid{ grid-template-columns:1fr; }
    }
    .ai-chip{display:inline-block;border:1px solid #d2ddea;background:#f7fbff;color:#304a62;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;}
    .ai-rich-card{
      margin-top:8px; border:1px solid #dbe3ee; border-radius:10px; background:#f8fafc; padding:10px;
    }
    .ai-rich-title{font-size:12px; font-weight:800; color:#334155; margin-bottom:6px;}
    .ai-rich-body{font-size:13px; color:#334155; line-height:1.5;}
    .ai-toast-wrap{
      position:fixed; right:14px; top:14px; z-index:10005; display:flex; flex-direction:column; gap:8px; max-width:360px;
    }
    .ai-toast{
      border:1px solid #d7e0eb; background:#fff; border-radius:10px; padding:9px 10px; font-size:12px; color:#1f2f46;
      box-shadow:0 8px 20px rgba(15,23,42,.14);
    }
    .ai-toast .undo{margin-left:8px; border:none; background:transparent; color:#0f766e; text-decoration:underline; cursor:pointer; font-size:12px; padding:0;}
    .msg-ai.alert .bubble{border-left:4px solid #f59e0b;}
    .msg-ai.question .bubble{border-left:4px solid #3b82f6;}
    .msg-ai.action .bubble{border-left:4px solid #10b981;}
    .iv-controls{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
    .iv-btn{border:1px solid #d2ddea; background:#fff; color:#334155; border-radius:999px; padding:4px 9px; font-size:11px; cursor:pointer;}
    .task-cards{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
    .task-card{
      background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:10px;
      box-shadow:0 1px 3px rgba(15,23,42,.08); display:flex; align-items:flex-start; gap:8px;
      transition:opacity .22s ease, transform .22s ease;
    }
    .task-card.done{opacity:.45; transform:translateY(-2px);}
    .rec-controls{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
    .rec-btn{
      border:1px solid #d4dee9; background:#fff; color:#0f172a;
      border-radius:10px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer;
    }
    .rec-btn:hover{background:#f8fafc;}
    .task-icon{
      font-size:14px; line-height:1.2; color:#64748b; margin-top:1px;
      border:1px solid #cbd5e1; border-radius:6px; background:#fff; cursor:pointer; width:22px; height:22px;
      display:inline-flex; align-items:center; justify-content:center; padding:0;
    }
    .task-main{font-size:13px; color:#0f172a; line-height:1.35;}
    .task-main p{margin:0;}
    .task-due{font-size:11px; color:#64748b; margin-top:2px;}
    #aiSendBtn{
      position:absolute; right:6px; top:50%; transform:translateY(-50%);
      height:38px; min-width:78px; border-radius:999px; font-size:12px; padding:0 14px;
    }
    .ai-open {
      position:fixed;
      right:14px;
      bottom:14px;
      z-index:10002;
      border:1px solid #dbe4ee;
      background:#fff;
      color:#1f2f46;
      border-radius:999px;
      padding:10px 12px;
      font-size:12px;
      font-weight:800;
      box-shadow:0 8px 18px rgba(15,23,42,.15);
      cursor:pointer;
    }
    .ai-worker-badge{
      position:fixed;
      right:14px;
      bottom:62px;
      z-index:10002;
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:1px solid #dbe4ee;
      background:#fff;
      color:#1f2f46;
      border-radius:999px;
      padding:6px 10px;
      font-size:11px;
      font-weight:800;
      line-height:1;
      box-shadow:0 6px 14px rgba(15,23,42,.12);
      user-select:none;
    }
    .ai-worker-dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:#94a3b8;
      border:1px solid rgba(15,23,42,.1);
      flex:0 0 auto;
    }
    .ai-worker-badge.ok .ai-worker-dot{ background:#10b981; }
    .ai-worker-badge.busy .ai-worker-dot{ background:#f59e0b; }
    .ai-worker-badge.degraded .ai-worker-dot{ background:#fb7185; }
    .ai-worker-badge.down .ai-worker-dot{ background:#ef4444; }
    .ai-ghost{
      position:fixed;
      right:18px;
      top:14px;
      width:10px;height:10px;border-radius:999px;
      z-index:10003;
      opacity:0;
      box-shadow:0 0 0 0 rgba(16,185,129,.55);
      transition:opacity .12s ease;
    }
    .ai-ghost.show{opacity:1;}
    .ai-ghost.idle{background:#94a3b8;}
    .ai-ghost.thinking{background:#10b981;animation:aiPulse 1.2s infinite;}
    .ai-ghost.running{background:#f59e0b;animation:aiPulse 1s infinite;}
    .ai-ghost.done{background:#10b981;}
    .ai-ghost.failed{background:#f43f5e;}
    @keyframes aiPulse{
      0%{ box-shadow:0 0 0 0 rgba(16,185,129,.55); }
      70%{ box-shadow:0 0 0 8px rgba(16,185,129,0); }
      100%{ box-shadow:0 0 0 0 rgba(16,185,129,0); }
    }
    @media (prefers-reduced-motion: reduce){
      .ai-ghost{animation:none !important;}
    }
    @media (max-width:780px){
      #cmdkCard{
        margin:10px;
        border-radius:14px;
        width:calc(100vw - 20px);
        height:calc(100vh - 20px);
        min-width:0;
        min-height:0;
        left:10px;
        top:10px;
        transform:none;
        resize:none;
      }
    }
    .section-title{margin:0 0 8px 0;font-size:18px;letter-spacing:.01em;}
    .subtle{font-size:12px;color:var(--muted);}
    @media (min-width:1020px) { .grid { grid-template-columns:1fr 1fr; } .grid3{grid-template-columns:1fr 1fr 1fr;} }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
  <button id="aiOpenBtn" class="ai-open" type="button">AI</button>
  <div id="aiWorkerBadge" class="ai-worker-badge" title="AI worker health">
    <span class="ai-worker-dot" aria-hidden="true"></span>
    <span id="aiWorkerBadgeText">Worker: --</span>
  </div>
  <div id="aiToastWrap" class="ai-toast-wrap"></div>
  <div id="aiGhost" class="ai-ghost idle" aria-hidden="true"></div>
  <div id="cmdkOverlay">
    <div id="cmdkCard">
      <div class="ai-head" id="cmdkDragBar">
        <strong class="ai-title">AI Copilot</strong>
        <div class="ai-actions">
          <button type="button" id="cmdkSmaller" class="ai-icon-btn">-</button>
          <button type="button" id="cmdkBigger" class="ai-icon-btn">+</button>
          <button type="button" id="cmdkReset" class="ai-icon-btn">Reset</button>
          <button type="button" id="cmdkClose" class="ai-icon-btn">✕</button>
        </div>
      </div>
      <div class="ai-body">
        <div id="aiResult" class="ai-history" style="display:none;"></div>
        <div id="aiEmpty" class="ai-empty">How can I help you invest today?</div>
      </div>
      <div class="ai-foot">
        <div class="ai-chips-row" id="aiSuggestionRow">
          <button type="button" class="ai-chip-btn" data-prompt="show me my notes">Show Notes</button>
          <button type="button" class="ai-chip-btn" data-prompt="what are my notes today?">Notes Today</button>
          <button type="button" class="ai-chip-btn" data-prompt="summarize latest report">Summarize Report</button>
          <button type="button" class="ai-chip-btn" data-prompt="open company ADBE">Open Company</button>
          <button type="button" class="ai-chip-btn" data-prompt="find CRM 10-K">Find 10-K</button>
        </div>
        <form id="aiCmdForm">
          <div class="ai-input-wrap">
            <input id="aiCmdInput" placeholder="Ask Investor OS..." autocomplete="off" autofocus>
            <button id="aiSendBtn" type="submit">Send</button>
          </div>
          <div class="ai-input-tools">
            <button id="aiImageBtn" class="ai-upload-btn" type="button">Upload Image</button>
            <input id="aiImageInput" type="file" accept="image/png,image/jpeg,image/webp" style="display:none;">
            <button id="aiVoiceBtn" class="ai-voice-btn" type="button">Mic</button>
            <select id="aiVoiceRate" class="ai-voice-rate" title="Voice speed">
              <option value="0.9">0.9x</option>
              <option value="1.0" selected>1.0x</option>
              <option value="1.15">1.15x</option>
              <option value="1.3">1.3x</option>
            </select>
            <div id="aiUploadPill" class="ai-upload-pill">
              <img id="aiUploadThumb" class="ai-upload-thumb" alt="upload preview">
              <span id="aiUploadName"></span>
              <button id="aiUploadClear" type="button">x</button>
            </div>
          </div>
          <div class="ai-meta" id="aiStateText" style="margin-top:8px;">Idle</div>
          <div class="ai-meta" id="aiInterviewProgress" style="margin-top:4px;display:none;"></div>
          <div id="aiPhase2Panel" class="ai-phase2">
            <div class="ai-phase2-top">
              <div class="ai-phase2-title">Phase 2 Map/Reduce</div>
              <div id="aiPhase2Status" class="ai-phase2-status">status: --</div>
            </div>
            <div class="ai-phase2-grid">
              <input id="aiPhase2Tickers" placeholder="Tickers (AAPL,MSFT,CRM)">
              <input id="aiPhase2Question" placeholder="Question (e.g. margin durability next 2q)">
            </div>
            <div class="ai-phase2-top">
              <button id="aiPhase2RunBtn" class="ai-phase2-run" type="button">Run Sector Analysis</button>
              <div id="aiPhase2Progress" class="ai-phase2-progress"></div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script>
    (function(){
      var ov=document.getElementById('cmdkOverlay');
      var closeBtn=document.getElementById('cmdkClose');
      var smallerBtn=document.getElementById('cmdkSmaller');
      var biggerBtn=document.getElementById('cmdkBigger');
      var resetBtn=document.getElementById('cmdkReset');
      var card=document.getElementById('cmdkCard');
      var dragBar=document.getElementById('cmdkDragBar');
      var openBtn=document.getElementById('aiOpenBtn');
      var navBtn=document.getElementById('ai-trigger-btn');
      var workerBadge=document.getElementById('aiWorkerBadge');
      var workerBadgeText=document.getElementById('aiWorkerBadgeText');
      var form=document.getElementById('aiCmdForm');
      var input=document.getElementById('aiCmdInput');
      var imageBtn=document.getElementById('aiImageBtn');
      var imageInput=document.getElementById('aiImageInput');
      var voiceBtn=document.getElementById('aiVoiceBtn');
      var speakToggleBtn=document.getElementById('aiSpeakToggle');
      var voiceLoopToggleBtn=document.getElementById('aiVoiceLoopToggle');
      var voiceRateSel=document.getElementById('aiVoiceRate');
      var uploadPill=document.getElementById('aiUploadPill');
      var uploadName=document.getElementById('aiUploadName');
      var uploadThumb=document.getElementById('aiUploadThumb');
      var uploadClear=document.getElementById('aiUploadClear');
      var result=document.getElementById('aiResult');
      var ghost=document.getElementById('aiGhost');
      var toastWrap=document.getElementById('aiToastWrap');
      var stateText=document.getElementById('aiStateText');
      var interviewProgressEl=document.getElementById('aiInterviewProgress');

              data = await new Promise(function(resolve, reject){
                var done = false;
                var es = null;
                var timer = setTimeout(function(){
                  if(done){ return; }
                  done = true;
                  try { if(es){ es.close(); } } catch(_e){}
                  reject(new Error('sse_timeout'));
                }, 50000);
                function finishOk(payload){
                  if(done){ return; }
                  done = true;
                  clearTimeout(timer);
                  try { if(es){ es.close(); } } catch(_e){}
                  resolve(payload || {});
                }
                function finishErr(err){
                  if(done){ return; }
                  done = true;
                  clearTimeout(timer);
                  try { if(es){ es.close(); } } catch(_e){}
                  reject(err || new Error('sse_error'));
                }
                try {
                  es = new EventSource('/ai/command/sse/' + encodeURIComponent(String(queue.job_id || '')));
                } catch(_esCreateErr){
                  finishErr(_esCreateErr);
                  return;
                }
                es.addEventListener('result', function(ev){
                  try{
                    var obj = JSON.parse(String(ev.data || '{}'));
                    finishOk((obj && typeof obj.result === 'object') ? obj.result : {});
                  } catch(_parseErr){
                    finishErr(_parseErr);
                  }
                });
                es.addEventListener('error', function(ev){
                  try{
                    var obj = JSON.parse(String((ev && ev.data) || '{}'));
                    if(obj && obj.result && typeof obj.result === 'object'){
                      finishOk(obj.result);
                    } else {
                      finishErr(new Error(String(obj.error || 'sse_error')));
                    }
                  } catch(_e){
                    finishErr(new Error('sse_error'));
                  }
                });
                es.addEventListener('partial', function(_ev){
                  setState('running');
                });
              });
            }
            setInterviewProgress(data ? data.interview_progress : null);
            if(data.status === 'needs_clarification' || data.status === 'needs_confirmation' || data.status === 'needs_input'){
              pendingQuery = q;
            } else {
              pendingQuery = '';
            }
            if(String(data.intent || '') === 'portfolio_interview'){
              if(String(data.status || '') === 'needs_input' || String(data.status || '') === 'needs_confirmation' || String(data.status || '') === 'needs_clarification'){
                interviewPending = true;
              } else {
                interviewPending = false;
              }
            }
            var navIntents = {
              open_page:true, app_map_route:true, open_notes:true, open_company:true,
              open_sec_filings:true, maps_to:true
            };
            var intentNow = String(data.intent || '').trim().toLowerCase();
            var action = (data && typeof data.action === 'object' && data.action) ? data.action : null;
            var at = action ? String(action.type || '').trim().toUpperCase() : '';
            var navTarget = '';
            if(at === 'NAVIGATE'){
              navTarget = String(action.payload || '').trim();
            } else {
              var rd = String(data.redirect_url || '').trim();
              if(rd && data.status === 'ok' && (
                intentNow === 'open_page' ||
                intentNow === 'app_map_route' ||
                intentNow === 'open_notes' ||
                intentNow === 'open_company' ||
                intentNow === 'open_sec_filings' ||
                intentNow === 'maps_to'
              )){
                navTarget = rd;
              }
            }
            if(navIntents[intentNow] && !navTarget){
              showToast('Redirecting...');
              setState('done');
              awaitingAssistant = false;
              voiceSubmitting = false;
              return;
            }
            if(navTarget){
              setState('done');
              var label = navTarget.indexOf('/my_universe') === 0 ? 'Portfolio' : (navTarget.indexOf('/organizer')===0 ? 'Organizer' : (navTarget.indexOf('/reports')===0 ? 'Reports' : 'page'));
              showToast('🚀 Redirecting to ' + label + '...');
              awaitingAssistant = false;
              voiceSubmitting = false;
              setTimeout(function(){ window.location.assign(navTarget); }, 120);
              return;
            }
            var assistantMsg = {
              role:'assistant',
              intent: String(data.intent || ''),
              status: String(data.status || ''),
              text: String(data.message || '-'),
              ui: (data && typeof data.ui === 'object' && data.ui) ? data.ui : {},
              meta: String((data.intent || 'unknown') + ' · confidence ' + (data.confidence || 0) + ' · ' + (data.status || 'ok')),
              traces: Array.isArray(data.traces) ? data.traces : [],
              citations: Array.isArray(data.citations) ? data.citations : [],
              redirect_url: String(data.redirect_url || ''),
              _id: Date.now() + 1
            };
            aiThread.push(assistantMsg);
            renderThread();
            setState('done');
            awaitingAssistant = false;
            voiceSubmitting = false;
            if(autoReadAloud){
              speakText(assistantMsg.text || '', function(){ maybeResumeVoiceLoop(200); });
            } else {
              maybeResumeVoiceLoop(200);
            }
            if(assistantMsg.intent === 'save_thesis'){
              showToast('Saved to memory: thesis updated.');
            } else if(assistantMsg.intent === 'add_daily_log'){
              showToast('Saved to memory: daily log updated.');
            } else if(assistantMsg.intent === 'add_task'){
              showToast('Task created.');
            } else if(assistantMsg.intent === 'add_note_draft'){
              var undoText = q.replace(/^[^:]*:\s*/,'').trim().slice(0,50);
              var tkUndo = (String(data.message||'').match(/\bfor\s+([A-Z]{1,6})\b/)||[])[1] || '';
              showToast('Draft note saved.', {
                onUndo: function(){
                  var cmd = tkUndo ? ('delete AI notes for ' + tkUndo + (undoText ? (' containing ' + undoText) : '')) : ('delete AI notes' + (undoText ? (' containing ' + undoText) : ''));
                  if(input){ input.value = cmd; form && form.requestSubmit(); }
                },
                ms: 6000
              });
            } else if(assistantMsg.intent === 'backfill_trade_history'){
              showToast('Saved to history log.');
            }
          } catch(_e){
            clearUpload();
            awaitingAssistant = false;
            voiceSubmitting = false;
            aiThread.push({role:'assistant', intent:'error', status:'error', text:'Command failed. Please retry.', meta:'error', traces:[], citations:[], redirect_url:'', _id: Date.now()+2});
            renderThread();
            setState('failed');
            maybeResumeVoiceLoop(260);
            return;
          }
        });
      }
      if(phase2RunBtn){
        phase2RunBtn.addEventListener('click', function(){ runPhase2MapReduce(); });
      }
      loadState();
      loadVoicePrefs();
      initSpeechRecognition();
      updateVoiceUi();
      maybeInjectMorningBrief();
      pollPhase2Status();
      pollProactiveBadge().finally(function(){ scheduleProactivePoll(proactivePollMs); });
      pollWorkerHealth().finally(function(){ scheduleWorkerHealthPoll(workerHealthPollMs); });
      document.addEventListener('visibilitychange', function(){
        if(document.hidden){
          try { if(proactivePollTimer){ clearTimeout(proactivePollTimer); proactivePollTimer = null; } } catch(_e) {}
          try { if(workerHealthPollTimer){ clearTimeout(workerHealthPollTimer); workerHealthPollTimer = null; } } catch(_e) {}
          stopPhase2Poll();
          return;
        }
        pollPhase2Status();
        pollProactiveBadge().finally(function(){ scheduleProactivePoll(8000); });
        pollWorkerHealth().finally(function(){ scheduleWorkerHealthPoll(5000); });
        if(phase2ReducerId){ phase2PollLoop(700); }
      });
      if(ghost){ ghost.className='ai-ghost show idle'; }
    })();
  </script>
</body>
</html>
