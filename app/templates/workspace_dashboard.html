{% extends "base.html" %}
{% block title %}Workspace | Investor OS v2{% endblock %}
{% block head_extra %}
<style>
  /* Hide the legacy AI* floating button and worker badge on the dashboard —
     the bottom bar is the single AI entry point here. */
  #aiOpenBtn, #aiWorkerBadge { display: none !important; }

  .ws{display:grid;grid-template-columns:200px 1fr 260px;gap:12px;padding:12px;}
  .ws-card{background:#fff;border:1px solid #dbe4ee;border-radius:12px;padding:10px;}
  .ws-side h3,.ws-right h3{margin:0 0 10px 0;font-size:11px;text-transform:uppercase;color:#94a3b8;letter-spacing:.07em;font-weight:800;}
  .ws-ch{display:block;width:100%;text-align:left;border:none;background:transparent;color:#475569;border-radius:8px;padding:7px 10px;margin-bottom:2px;font-size:13px;font-weight:600;cursor:pointer;transition:background .1s,color .1s;}
  .ws-ch:hover{background:#f1f5f9;color:#0f172a;}
  .ws-ch.active{background:#f1f5f9;color:#0f172a;font-weight:800;}
  .ws-ch.active::before{content:'';display:inline-block;width:3px;height:14px;background:#0f172a;border-radius:2px;margin-right:8px;vertical-align:middle;}
  .ws-main{display:grid;grid-template-rows:auto 1fr auto;min-height:78vh;}
  .ws-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .ws-title{font-size:18px;font-weight:800;color:#0f172a;}
  .ws-feed{overflow:auto;min-height:0;display:grid;gap:8px;padding-right:4px;align-content:start;}
  .ws-item{border:1px solid #e2e8f0;border-radius:10px;background:#fff;padding:10px 12px;}
  .ws-item-error{border-color:#fecaca;background:#fff7f7;}
  .ws-item-thinking{border-color:#e0f2fe;background:#f0f9ff;animation:ws-pulse 1.4s ease-in-out infinite;}
  @keyframes ws-pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .ws-item h4{margin:0 0 4px 0;font-size:13px;font-weight:700;color:#0f172a;}
  .ws-meta{font-size:11px;color:#94a3b8;margin-bottom:5px;}
  .ws-text{white-space:pre-wrap;font-size:13px;color:#334155;line-height:1.55;}
  .ws-item-user{background:#f8fafc;}
  .ws-item-ai{background:#fff;border-color:#dbeafe;}
  .ws-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .ws-act{border:1px solid #e2e8f0;background:#f8fafc;color:#475569;border-radius:7px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;transition:background .1s;}
  .ws-act:hover{background:#f1f5f9;color:#0f172a;}
  .ws-act-primary{background:#0f172a;color:#fff;border-color:#0f172a;}
  .ws-act-primary:hover{background:#1e293b;}
  .ws-status{font-size:11px;color:#64748b;margin-top:6px;}

  /* ── AI Input bar ─────────────────────────────────────────────────────── */
  .ws-input{margin-top:12px;}
  .ws-input-wrap{display:flex;align-items:center;gap:8px;border:1.5px solid #e2e8f0;border-radius:16px;background:#fff;padding:9px 12px;transition:border-color .15s,box-shadow .15s;}
  .ws-input-wrap:focus-within{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.08);}
  .ws-input-wrap input{flex:1;border:none;outline:none;background:transparent;height:26px;font-size:14px;color:#0f172a;}
  .ws-input-wrap input::placeholder{color:#94a3b8;}
  .ws-input-wrap input:disabled{color:#94a3b8;}
  /* Mode badge — changes based on query type */
  .ws-mode{font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;white-space:nowrap;transition:all .2s;}
  .ws-mode-fast{color:#059669;background:#ecfdf5;border:1px solid #a7f3d0;}
  .ws-mode-deep{color:#7c3aed;background:#f5f3ff;border:1px solid #ddd6fe;}
  .ws-send{border:none;background:#0f172a;color:#fff;border-radius:10px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;min-width:52px;transition:background .15s,opacity .15s;}
  .ws-send:hover{background:#1e293b;}
  .ws-send:disabled{opacity:.35;cursor:not-allowed;}
  .ws-hint{font-size:11px;color:#475569;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:5px 10px;margin-top:6px;display:none;}
  .ws-hint.visible{display:block;}

  .ws-clear-btn{font-size:11px;color:#94a3b8;background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;}
  .ws-clear-btn:hover{color:#dc2626;}
  .ws-right .hint{font-size:12px;color:#475569;line-height:1.4;}
  @media (max-width:1100px){.ws{grid-template-columns:1fr;}.ws-right{order:3;}.ws-side{order:1;}.ws-main{order:2;min-height:65vh;}}
</style>
{% endblock %}
{% block body %}
<div class="ws">
  <aside class="ws-card ws-side">
    <h3>Channels</h3>
    {% for c in channels %}
    <button class="ws-ch {% if c.id == active_channel %}active{% endif %}" data-channel="{{ c.id }}"># {{ c.label }}</button>
    {% endfor %}
  </aside>

  <section class="ws-card ws-main">
    <div class="ws-head">
      <div class="ws-title" id="wsTitle"># All</div>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="ws-clear-btn" id="wsClearHistory" style="display:none" type="button">Clear history</button>
        <a class="btn" href="/dashboard/classic">Classic Dashboard</a>
      </div>
    </div>
    <div class="ws-feed" id="wsFeed"></div>
    <form class="ws-input" id="wsForm">
      <div class="ws-input-wrap">
        <input id="wsText" type="text" placeholder="Ask your portfolio anything…" autocomplete="off" autocorrect="off" spellcheck="false">
        <span class="ws-mode ws-mode-fast" id="wsModeBadge">⚡ Fast</span>
        <button class="ws-send" id="wsSend" type="submit">Ask</button>
      </div>
      <div class="ws-hint" id="wsHint"></div>
    </form>
  </section>

  <aside class="ws-card ws-right">
    <h3>Context</h3>
    <div id="wsContext">
      <div class="hint">Loading…</div>
    </div>
  </aside>
</div>

<script>
(() => {
  const channels     = Array.from(document.querySelectorAll('.ws-ch'));
  const feedEl       = document.getElementById('wsFeed');
  const titleEl      = document.getElementById('wsTitle');
  const formEl       = document.getElementById('wsForm');
  const textEl       = document.getElementById('wsText');
  const sendBtn      = document.getElementById('wsSend');
  const hintEl       = document.getElementById('wsHint');
  const modeBadge    = document.getElementById('wsModeBadge');
  const clearHistBtn = document.getElementById('wsClearHistory');
  let active    = 'all';
  let lastItems = [];
  let isSending = false;
  let hintTimer = null;

  // Dynamic mode badge: update as user types
  textEl.addEventListener('input', () => {
    const deep = isDeepQuery(textEl.value);
    modeBadge.textContent  = deep ? '🔍 Deep' : '⚡ Fast';
    modeBadge.className    = 'ws-mode ' + (deep ? 'ws-mode-deep' : 'ws-mode-fast');
  });

  // ── helpers ──────────────────────────────────────────────────────────────
  function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // Human-readable timestamp: "2:53 PM" today, "Feb 27, 2:53 PM" otherwise
  function fmtTs(raw) {
    if(!raw) return '';
    try{
      const d   = new Date(String(raw));
      const now = new Date();
      const time = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
      if(d.toDateString() === now.toDateString()) return time;
      return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ', ' + time;
    }catch(_){ return String(raw).slice(0,16); }
  }

  // Bug 4: lightweight markdown → safe HTML (esc() first, then markup — safe for innerHTML)
  function mdRender(raw) {
    let s = esc(raw);
    // bold **text**
    s = s.replace(/\*\*([^*\n]{1,200})\*\*/g, '<b>$1</b>');
    // italic *text* (skip if adjacent to another *)
    s = s.replace(/(?<!\*)\*([^*\n]{1,120})\*(?!\*)/g, '<em>$1</em>');
    // headings ## text (only at line start)
    s = s.replace(/^#{1,3}\s+(.+)$/gm, '<span style="font-weight:800">$1</span>');
    // bullet lines:  - item  or  • item
    s = s.replace(/^[-•]\s(.+)$/gm, '<span style="display:block;padding-left:14px;position:relative"><span style="position:absolute;left:4px;color:#64748b">•</span>$1</span>');
    // numbered list: 1. item
    s = s.replace(/^(\d+)\.\s(.+)$/gm, '<span style="display:block;padding-left:14px;position:relative"><span style="position:absolute;left:0;font-weight:700;color:#64748b">$1.</span>$2</span>');
    return s;
  }

  function channelLabel(id){
    const btn = channels.find(b => b.dataset.channel === id);
    return btn ? btn.textContent.trim() : `# ${id}`;
  }
  function isAssistantMessage(it){
    return String(it.channel || '') === 'ai-agent' && String(it.meta || '').toLowerCase() === 'assistant';
  }
  function isErrorText(text){
    const t = String(text || '').toLowerCase();
    return t.includes('transport issue') || t.includes('command failed') || t.includes('could not complete') || t.includes('error');
  }
  function smartErrorHelp(text){
    const t = String(text || '').toLowerCase();
    if(t.includes('transport issue')) return 'AI transport timeout. Retry once; if repeated, check AI provider key/network.';
    if(t.includes('permission') || t.includes('forbidden')) return 'Permission issue. Verify auth token or service IAM access.';
    return 'Request failed. Retry with a more specific question, e.g. "analyze $CRM margins".';
  }
  function withUiActions(it){
    const base = Array.isArray(it.actions) ? it.actions.slice() : [];
    if(isAssistantMessage(it) && String(it.text || '').trim()){
      base.push({label:'Save to Notes', method:'POST_FORM', url:'/dashboard/ai-agent/save-note'});
      base.push({label:'Discard', method:'CLIENT', action:'discard'});
      if(isErrorText(it.text)){ base.push({label:'Retry', method:'CLIENT', action:'retry'}); }
    }
    return base;
  }
  function actionHtml(it){
    const actions = withUiActions(it);
    if(!actions.length) return '';
    return `<div class="ws-actions">${actions.map((a, idx) => {
      const label = esc(a.label || 'Action');
      const cls = label.toLowerCase().includes('save') ? 'ws-act ws-act-primary' : 'ws-act';
      return `<button class="${cls}" data-item-idx="__ITEMIDX__" data-action-idx="${idx}" type="button">${label}</button>`;
    }).join('')}</div>`;
  }

  // Bug 2: loading state helpers
  function setLoading(on) {
    isSending = on;
    textEl.disabled = on;
    sendBtn.disabled = on;
    sendBtn.textContent = on ? '…' : 'Send';
  }
  function showHint(msg, ms = 4000) {
    clearTimeout(hintTimer);
    hintEl.textContent = msg;
    hintEl.classList.add('visible');
    hintTimer = setTimeout(() => hintEl.classList.remove('visible'), ms);
  }

  // ── render ────────────────────────────────────────────────────────────────
  function render(items){
    lastItems = Array.isArray(items) ? items.slice() : [];
    if(!Array.isArray(items) || !items.length){
      feedEl.innerHTML = '<div class="ws-item"><h4>No items yet</h4><div class="ws-text">No feed data for this channel.</div></div>';
      return;
    }
    feedEl.innerHTML = items.map((it, itemIdx) => {
      // Bug 2: thinking placeholder (not stored in DB, purely local)
      if(it._thinking){
        return `<article class="ws-item ws-item-thinking">
          <h4>Investor AI</h4>
          <div class="ws-text" style="color:#64748b">Thinking…</div>
        </article>`;
      }
      const isChat = String(it.kind || '') === 'chat_message' || String(it.channel || '') === 'ai-agent';
      const isUser = isChat && String(it.meta || '').toLowerCase() === 'user';
      const isAI   = isAssistantMessage(it);
      const err    = isAI && isErrorText(it.text || '');
      const info   = err ? `<div class="ws-status">${esc(smartErrorHelp(it.text || ''))}</div>` : '';

      // Meta line: for chat messages show only timestamp (not raw role labels)
      const metaLine = isChat
        ? `<span style="color:#94a3b8">${fmtTs(it.ts)}</span>`
        : `${esc(it.meta || '')}${it.ts ? ' · ' + fmtTs(it.ts) : ''}`;

      // Bug 4: markdown rendering for assistant messages only
      const body = isAI ? mdRender(it.text || '') : esc(it.text || '');

      // Chat items: style user vs AI differently
      const itemClass = err ? 'ws-item-error' : (isUser ? 'ws-item-user' : (isAI ? 'ws-item-ai' : ''));

      return `<article class="ws-item ${itemClass}" data-item-idx="${itemIdx}">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
          <h4 style="margin:0;font-size:13px;${isUser ? 'color:#475569' : ''}">${esc(it.title || 'Update')}</h4>
          <div class="ws-meta" style="margin:0">${metaLine}</div>
        </div>
        <div class="ws-text">${body}</div>
        ${actionHtml(it).replaceAll('__ITEMIDX__', String(itemIdx))}
        ${info}
      </article>`;
    }).join('');
    wireActions();
  }

  // ── deep query detection ─────────────────────────────────────────────────
  // Returns true when a prompt warrants the real agent loop (invest_cli data access)
  // vs a fast one-shot LLM call.
  function isDeepQuery(text) {
    const t = text.toLowerCase();
    if (/\$[a-z]{1,5}/i.test(text)) return true; // $AAPL / $CRM
    const kw = ['filing','10-k','10-q','8-k','earnings','margin','revenue','thesis',
                'analyz','financials','holdings','portfolio','insider','sec filing',
                'quarter','annual','cash flow','guidance','beat','miss','eps','fcf',
                'valuation','breach','what happened','what\'s new','what is new',
                'performance','results','balance sheet','buyback'];
    return kw.some(k => t.includes(k));
  }

  function extractTicker(text) {
    const m = text.match(/\$([A-Za-z]{1,5})/);
    if (m) return m[1].toUpperCase();
    // bare known tickers (holdings shown in context panel)
    const bare = text.match(/\b(AAPL|MSFT|GOOGL|AMZN|META|NVDA|CRM|HUBS|UNH|IT|IBM|ORCL|QCOM)\b/i);
    return bare ? bare[1].toUpperCase() : '';
  }

  // ── network ───────────────────────────────────────────────────────────────
  async function sendUserMessage(text, channel){
    const fd = new FormData();
    fd.append('channel', channel);
    fd.append('text', text);
    const res = await fetch('/dashboard/message', {method:'POST', body:fd});
    return res.json();
  }

  async function sendAgentQuery(text) {
    const fd = new FormData();
    fd.append('text', text);
    const tk = extractTicker(text);
    if (tk) fd.append('ticker', tk);
    const res = await fetch('/dashboard/agent-query', {method:'POST', body:fd});
    return res.json();
  }

  // Poll feed every 4s for up to 90s waiting for agent response, then revert to normal 20s
  let _agentPollTimer = null;
  function startAgentPoll() {
    if (_agentPollTimer) return;
    let elapsed = 0;
    _agentPollTimer = setInterval(async () => {
      elapsed += 4;
      await loadFeed();
      if (elapsed >= 90) {
        clearInterval(_agentPollTimer);
        _agentPollTimer = null;
      }
    }, 4000);
  }

  async function runAction(btn){
    const itemIdx = Number(btn.dataset.itemIdx || '-1');
    const actIdx  = Number(btn.dataset.actionIdx || '-1');
    const it      = lastItems[itemIdx] || {};
    const actions = withUiActions(it);
    const action  = actions[actIdx] || {};
    const method  = String(action.method || 'GET').toUpperCase();
    const url     = String(action.url || '').trim();
    if(!url && method !== 'CLIENT') return;
    if(method === 'GET'){ window.location.href = url; return; }
    if(method === 'POST_FORM'){
      btn.disabled = true;
      try{
        const fd = new FormData();
        fd.append('text', String(it.text || ''));
        fd.append('ticker', String(it.ticker || ''));
        await fetch(url, {method:'POST', body:fd, headers:{'Accept':'application/json'}});
        await loadFeed();
      }catch(_e){ btn.disabled = false; }
      return;
    }
    if(method === 'CLIENT'){
      if(String(action.action || '') === 'discard'){
        lastItems.splice(itemIdx, 1);
        render(lastItems);
        return;
      }
      if(String(action.action || '') === 'retry'){
        let retryPrompt = '';
        for(let i = itemIdx + 1; i < lastItems.length; i += 1){
          const cand = lastItems[i] || {};
          if(String(cand.channel || '') === 'ai-agent' && String(cand.meta || '').toLowerCase() === 'user'){
            retryPrompt = String(cand.text || '').trim();
            break;
          }
        }
        if(!retryPrompt){ retryPrompt = String(textEl.value || '').trim(); }
        if(!retryPrompt){ return; }
        setLoading(true);
        try{
          const data = await sendUserMessage(retryPrompt, 'ai-agent');
          if(data && data.reply){ await loadFeed(); }
        } finally { setLoading(false); }
        return;
      }
      return;
    }
    btn.disabled = true;
    try{
      await fetch(url, {method, headers: {'Accept':'application/json'}});
      await loadFeed();
    }catch(_e){ btn.disabled = false; }
  }

  function wireActions(){
    document.querySelectorAll('.ws-act').forEach(btn => {
      btn.onclick = () => runAction(btn);
    });
  }

  async function loadFeed(){
    const res = await fetch(`/dashboard/feed?channel=${encodeURIComponent(active)}&limit=50`);
    const data = await res.json();
    render(data.items || []);
  }

  // ── channel switching ─────────────────────────────────────────────────────
  function updateClearBtn() {
    clearHistBtn.style.display = active === 'ai-agent' ? '' : 'none';
  }

  channels.forEach(btn => {
    btn.addEventListener('click', () => {
      channels.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      active = btn.dataset.channel || 'all';
      titleEl.textContent = channelLabel(active);
      updateClearBtn();
      loadFeed();
    });
  });

  clearHistBtn.addEventListener('click', async () => {
    if(!confirm('Clear all AI Chat history? This cannot be undone.')) return;
    clearHistBtn.disabled = true;
    try{
      await fetch('/dashboard/ai-agent/clear-history', {method:'POST', headers:{'Accept':'application/json'}});
      await loadFeed();
    } finally { clearHistBtn.disabled = false; }
  });

  function switchToAiAgent() {
    const btn = channels.find(b => b.dataset.channel === 'ai-agent');
    if(btn) btn.click();
  }

  // ── form submit ───────────────────────────────────────────────────────────
  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(isSending) return;
    const text = textEl.value.trim();
    if(!text) return;

    textEl.value = '';
    // Always switch to AI Chat channel so the response is visible
    switchToAiAgent();

    const mine = {channel:'ai-agent', title:'You', text, meta:'user', ts:new Date().toISOString()};
    const deep  = isDeepQuery(text);

    if (deep) {
      // Deep query: agent loop fetches real data. Returns immediately, result appears in feed.
      const analyzing = {channel:'ai-agent', title:'Investor AI',
        text:'Analyzing… fetching real portfolio data. Result will appear here shortly.',
        meta:'assistant', _thinking:true, ts:new Date().toISOString()};
      render([analyzing, mine, ...lastItems].slice(0, 51));
      try {
        await sendAgentQuery(text);
        startAgentPoll(); // speed up feed refresh while agent runs
      } catch(_e) {
        const err = {channel:'ai-agent', title:'Investor AI',
          text:'Could not reach agent. Check network.', meta:'assistant', ts:new Date().toISOString()};
        render([err, mine, ...lastItems].slice(0, 50));
      }
    } else {
      // Fast path: one-shot LLM for simple questions
      setLoading(true);
      render([{_thinking:true}, mine, ...lastItems].slice(0, 51));
      try{
        const data = await sendUserMessage(text, 'ai-agent');
        if(data && data.reply){
          const bot = {channel:'ai-agent', title:'Investor AI', text:data.reply, meta:'assistant', ts:data.ts || new Date().toISOString()};
          render([bot, mine, ...lastItems].slice(0, 50));
        } else {
          await loadFeed();
        }
      } catch(_e) {
        const bot = {channel:'ai-agent', title:'Investor AI', text:'Could not reach AI. Check network and try again.', meta:'assistant', ts:new Date().toISOString()};
        render([bot, mine, ...lastItems].slice(0, 50));
      } finally {
        setLoading(false);
      }
    }
  });

  loadFeed();
  setInterval(loadFeed, 20000);

  // ── global top bar interception (dashboard page only) ─────────────────────
  // If the user types an investment question in the global omnibox (top of page),
  // route it to the agent instead of the organizer task input.
  const globalOmnibox     = document.getElementById('globalOmniboxInput');
  const globalOmniboxForm = globalOmnibox && globalOmnibox.closest('form');
  if (globalOmnibox && globalOmniboxForm) {
    globalOmnibox.placeholder = 'Add a task or note… (investment questions go in the bar below)';
    globalOmniboxForm.addEventListener('submit', async (e) => {
      const text = (globalOmnibox.value || '').trim();
      if (!text) return;
      // Route to agent if it looks like an investment question
      if (isDeepQuery(text) || text.includes('?')) {
        e.preventDefault();
        globalOmnibox.value = '';
        switchToAiAgent();
        // Feed the text into the AI Agent channel input and trigger the submit flow
        textEl.value = text;
        formEl.dispatchEvent(new Event('submit', {bubbles: true, cancelable: true}));
      }
      // else: let the organizer handle task/note entries as normal
    });
  }

  // ── live right panel ──────────────────────────────────────────────────────
  async function loadContext(){
    try{
      const res = await fetch('/dashboard/context');
      const d   = await res.json();
      const el  = document.getElementById('wsContext');
      if(!el) return;
      const statusColor = (d.last_run_status||'').toLowerCase() === 'completed' ? '#16a34a'
                        : (d.last_run_status||'').toLowerCase() === 'error'     ? '#dc2626' : '#64748b';
      let holdingsHtml = '';
      if(Array.isArray(d.holdings) && d.holdings.length){
        holdingsHtml = '<div style="margin-top:10px;font-size:11px;font-weight:700;color:#64748b;letter-spacing:.05em;">HOLDINGS</div>'
          + d.holdings.map(h => `<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;">
              <span style="font-weight:700">${esc(h.ticker)}</span>
              <span style="color:#64748b">${esc(h.weight)}</span></div>`).join('');
      }
      el.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
          <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px;text-align:center;">
            <div style="font-size:20px;font-weight:800;color:#15803d">${esc(String(d.open_proposals||0))}</div>
            <div style="font-size:10px;color:#64748b">Open Proposals</div>
          </div>
          <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px;text-align:center;">
            <div style="font-size:20px;font-weight:800;color:#dc2626">${esc(String(d.breach_alerts||0))}</div>
            <div style="font-size:10px;color:#64748b">Breach Alerts</div>
          </div>
        </div>
        <div style="font-size:11px;font-weight:700;color:#64748b;letter-spacing:.05em;margin-bottom:4px;">LAST AGENT RUN</div>
        <div style="font-size:12px;font-weight:700;color:${statusColor}">${esc(d.last_run_status||'—')}</div>
        <div style="font-size:11px;color:#64748b">${esc(d.last_run_agent||'')} ${esc(d.last_run_at||'')}</div>
        ${holdingsHtml}
        <div style="margin-top:12px;font-size:11px;color:#94a3b8;">Type in the bar below to ask AI anything about your portfolio.</div>`;
    }catch(_){}
  }
  loadContext();
  setInterval(loadContext, 60000);
})();
</script>
