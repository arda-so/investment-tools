{% extends "base.html" %}
{% block title %}Reports | Investor OS v2{% endblock %}
{% block head_extra %}
<style>
  .newsstand { display:grid; gap:14px; }
  .hero { display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap; }
  .hero h2 { margin:0; font-size:24px; letter-spacing:.01em; }
  .hero .sub { color:var(--muted); font-size:12px; }

  .priority-grid {
    display:grid;
    gap:10px;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  }
  .p-card {
    display:block;
    text-decoration:none;
    color:inherit;
    border:1px solid var(--border2);
    border-radius:12px;
    background:var(--panel);
    padding:12px;
    box-shadow:0 1px 3px rgba(15,23,42,.05);
    border-top-width:4px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .p-card:hover { transform:translateY(-1px); box-shadow:0 6px 18px rgba(15,23,42,.08); }
  .p-daily { border-top-color:var(--up); }
  .p-deep { border-top-color:var(--info); }
  .p-red { border-top-color:var(--down); background:var(--down-soft); }
  .p-l2 { border-top-color:var(--purple); }
  .p-head { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .p-kind { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .p-time { font-size:11px; color:var(--muted); }
  .p-title { margin-top:8px; font-size:15px; font-weight:800; color:var(--text); }
  .p-meta { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }

  .pill {
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    border-radius:999px;
    padding:2px 8px;
    font-size:11px;
    font-weight:700;
  }
  .pill.hot { border-color:var(--border); background:var(--agent-soft); color:var(--agent-ink); }
  .pill.new { border-color:var(--border); background:var(--down-soft); color:var(--down-ink); }

  .controls {
    display:grid;
    grid-template-columns:1fr 180px auto auto;
    gap:8px;
    align-items:center;
  }
  @media (max-width:980px) {
    .controls { grid-template-columns:1fr 1fr; }
  }

  .group { display:grid; gap:6px; }
  .group-head {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:2px;
  }
  .group-head h3 {
    margin:0;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:var(--text);
  }
  .group-head .count { color:var(--muted); font-size:11px; }

  .archive { display:grid; gap:0; border-top:1px solid var(--border); }
  .news-row {
    display:grid;
    grid-template-columns:14px minmax(0,1fr) auto;
    gap:8px;
    align-items:center;
    text-decoration:none;
    color:inherit;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    padding:8px 10px;
    min-height:42px;
    transition:background .12s ease;
  }
  .news-row:hover { background:var(--panel2); }
  .news-row.hot { box-shadow:inset 2px 0 0 var(--agent); }
  .news-row.sel { background:var(--info-soft); }

  .status-dot { width:8px; height:8px; border-radius:999px; background:var(--info); }
  .status-space { width:8px; height:8px; }

  .n-main { min-width:0; display:flex; align-items:baseline; gap:8px; overflow:hidden; }
  .n-title {
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:13px;
  }
  .n-title.unread { font-weight:800; color:var(--text); }
  .n-title.read { font-weight:600; color:var(--muted); }
  .n-snippet {
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:11px;
    color:var(--muted);
  }
  @media (max-width:880px) { .n-snippet { display:none; } }

  .n-right {
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .mini-tag {
    font-size:10px;
    line-height:1;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--panel2);
    color:var(--muted);
    padding:2px 4px;
  }
  .n-score {
    width:28px;
    text-align:right;
    font-size:12px;
    font-family:ui-monospace,Menlo,monospace;
    color:var(--text);
  }
  .n-score.hot { color:var(--agent-ink); font-weight:800; }
  .n-time {
    width:46px;
    text-align:right;
    font-size:11px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .n-go {
    width:14px;
    text-align:right;
    color:var(--muted);
    opacity:0;
    transition:opacity .12s ease;
  }
  .news-row:hover .n-go, .news-row.sel .n-go { opacity:1; }
</style>
{% endblock %}
{% block body %}
<div class="newsstand">
{% block reports_content %}{% endblock %}
</div>
{% endblock %}
