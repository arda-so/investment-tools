{% extends "base.html" %}
{% block title %}Dashboard | Investor OS v2{% endblock %}
{% block head_extra %}
<style>
  :root{
    --space-8: 8px;
    --space-12: 12px;
    --space-16: 16px;
  }
  body { background:#f8fafc; }
  .brief-nav.card {
    background:transparent;
    border:none;
    padding:8px 2px;
    margin-bottom:8px;
  }
  .brief-shell {
    display:grid;
    grid-template-columns:1fr;
    gap:var(--space-12);
    font-variant-numeric: tabular-nums;
  }
  .brief-card {
    background:#fff;
    border:1px solid #dbe4ee;
    border-radius:14px;
    box-shadow:0 1px 4px rgba(15,23,42,.05);
    padding:var(--space-16);
  }
  .brief-card.flat-card {
    background:transparent;
    border:none;
    box-shadow:none;
    border-radius:0;
    padding:4px 0 2px 0;
  }
  .brief-card.flat-card .mini-top,
  .brief-card.flat-card .wire-head {
    margin-bottom:6px;
    padding-bottom:6px;
    border-bottom:1px solid #e2e8f0;
  }
  .brief-card.flat-card .wire-box {
    background:#f8fafc;
    border:1px dashed #dbe4ee;
    min-height:34px;
  }
  .brief-card.flat-card .cmd-item {
    background:#f8fafc;
  }
  .brief-title { margin:0; font-size:22px; font-weight:800; letter-spacing:.01em; color:#0f172a; }
  .brief-sub { margin-top:3px; color:#64748b; font-size:12px; }

  .idx-grid { display:grid; grid-template-columns:1fr; gap:8px; }
  @media (min-width:900px){ .idx-grid { grid-template-columns:repeat(4, minmax(0,1fr)); } }
  .idx-card { border:1px solid #e2e8f0; border-radius:12px; padding:10px; background:#fff; }
  .idx-card {
    border:1px solid #cfdbea;
    border-radius:12px;
    padding:10px;
    background:linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    box-shadow:0 1px 4px rgba(15,23,42,.05);
  }
  .idx-card.js-index-card { cursor:pointer; transition:box-shadow .12s ease, transform .12s ease; }
  .idx-card.js-index-card:hover { box-shadow:0 6px 12px rgba(15,23,42,.10); transform:translateY(-1px); }
  .idx-name { color:#475569; font-size:10px; margin-bottom:3px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; }
  .idx-price { font-size:22px; font-weight:900; color:#0f172a; line-height:1.05; letter-spacing:.01em; }
  .idx-foot { margin-top:6px; display:flex; justify-content:flex-end; align-items:center; }
  .idx-r2k { border-color:#86efac; box-shadow:inset 0 0 0 1px #dcfce7, 0 2px 8px rgba(15,23,42,.05); }

  .chg-pill {
    display:inline-block;
    border-radius:8px;
    padding:2px 7px;
    font-size:11px;
    font-weight:800;
    letter-spacing:.01em;
  }
  .chg-pill.up { color:#10b981; background:#dcfce7; }
  .chg-pill.down { color:#f43f5e; background:#ffe4e6; }
  .chg-pill.flat { color:#64748b; background:#e2e8f0; }

  .dashboard-columns { display:grid; grid-template-columns:1fr; gap:var(--space-12); }
  @media (min-width:1100px){ .dashboard-columns { grid-template-columns:repeat(3, minmax(0,1fr)); align-items:start; } }
  .dash-col { display:grid; gap:var(--space-12); align-content:start; min-width:0; }
  .dashboard-main { display:grid; grid-template-columns:1fr; gap:var(--space-12); align-items:start; }
  .dash-main { display:grid; gap:var(--space-12); min-width:0; }
  .top-macro { display:grid; grid-template-columns:1fr; gap:var(--space-12); align-items:stretch; }
  @media (min-width:1000px){ .top-macro { grid-template-columns:repeat(3, minmax(0,1fr)); } }
  .top-live { display:grid; grid-template-columns:1fr; }
  .top-morning { display:grid; grid-template-columns:1fr; }
  .top-focus { display:grid; grid-template-columns:1fr; gap:var(--space-12); align-items:start; }
  @media (min-width:900px){ .top-focus { grid-template-columns:minmax(0,1.75fr) minmax(0,1fr); } }
  .mini-top { display:flex; justify-content:space-between; align-items:center; gap:var(--space-8); margin-bottom:var(--space-8); }
  .mini-head { margin:0; font-size:14px; color:#0f172a; letter-spacing:.02em; text-transform:uppercase; }
  .mini-upd { color:#475569; font-size:11px; }
  .earn-meta { margin-top:4px; margin-bottom:8px; }
  .mini-list { margin:0; padding-left:18px; color:#334155; font-size:13px; line-height:1.45; }
  .insight-grid { display:grid; grid-template-columns:1fr; gap:8px; }
  @media (min-width:900px){ .insight-grid { grid-template-columns:1fr 1fr; } }
  .insight-chip {
    border:1px solid #e8eef6;
    border-radius:10px;
    background:#f8fafc;
    padding:8px 10px;
  }
  .insight-head { font-size:12px; font-weight:800; color:#0f172a; margin-bottom:4px; }
  .insight-body {
    color:#475569; font-size:12px; line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .morning-card { border-color:#d7e3f1; background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%); }
  .morning-head { margin:0; font-size:16px; font-weight:800; color:#0f172a; letter-spacing:.01em; }
  .morning-sub { color:#64748b; font-size:12px; margin-top:2px; }
  .morning-list {
    list-style:none;
    margin:10px 0 0 0;
    padding:0;
    display:grid;
    gap:8px;
  }
  .morning-compact {
    max-height:520px;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .morning-compact .morning-list {
    flex:1 1 auto;
    min-height:0;
    max-height:none;
    overflow:auto;
    padding-right:4px;
  }
  .morning-compact .morning-row {
    padding:8px 10px;
  }
  .morning-compact .morning-text {
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .morning-row {
    border:1px solid #e2e8f0;
    border-radius:10px;
    background:#fff;
    padding:10px 12px;
  }
  .morning-kicker {
    font-size:11px;
    font-weight:800;
    color:#334155;
    letter-spacing:.03em;
    text-transform:uppercase;
    margin-bottom:3px;
  }
  .morning-text {
    color:#334155;
    font-size:13px;
    line-height:1.45;
  }
  .mini-table { width:100%; border-collapse:collapse; font-size:12px; }
  .mini-table th, .mini-table td { border-bottom:1px solid #e2e8f0; padding:6px 5px; text-align:left; }
  .mini-table th { color:#64748b; font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
  .risk-badge { display:inline-block; border-radius:999px; font-size:10px; font-weight:800; padding:2px 8px; letter-spacing:.03em; }
  .risk-badge.red { background:#ffe4e6; color:#be123c; border:1px solid #fecdd3; }
  .risk-badge.orange { background:#fff7ed; color:#c2410c; border:1px solid #fed7aa; }
  .risk-badge.beat { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
  .risk-badge.miss { background:#fff1f2; color:#be123c; border:1px solid #fecdd3; }
  .risk-badge.eps { background:#f8fafc; color:#0f172a; border:1px solid #e2e8f0; }
  .risk-badge.reported { background:#eef2ff; color:#3730a3; border:1px solid #c7d2fe; }
  .risk-badge.verified { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; }
  .risk-badge.preliminary { background:#f8fafc; color:#64748b; border:1px solid #cbd5e1; }
  .risk-badge.upcoming { background:#f8fafc; color:#334155; border:1px solid #cbd5e1; }
  .analyze-btn { border:1px solid #dbe4ee; background:#fff; color:#334155; border-radius:8px; padding:3px 7px; text-decoration:none; font-size:12px; font-weight:700; }
  .tk-strong { font-weight:800; letter-spacing:.01em; }
  .atlow-dot {
    display:inline-block;
    width:7px; height:7px; border-radius:50%;
    background:#ef4444; margin-left:6px; vertical-align:middle;
    box-shadow:0 0 0 0 rgba(239,68,68,.7);
    animation:pulseDot 1.6s infinite;
  }
  @keyframes pulseDot {
    0% { box-shadow:0 0 0 0 rgba(239,68,68,.7); }
    70% { box-shadow:0 0 0 8px rgba(239,68,68,0); }
    100% { box-shadow:0 0 0 0 rgba(239,68,68,0); }
  }
  .earn-date { position:sticky; top:0; background:#f8fafc; z-index:1; font-size:12px; font-weight:800; color:#334155; padding:6px 0; border-bottom:1px solid #e2e8f0; margin-bottom:4px; }
  .feed-scroll { max-height:600px; overflow-y:auto; padding-right:4px; }
  .feed-scroll.earnings-feed { max-height:300px; }
  .earn-filters { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .earn-filter-btn {
    border:1px solid #dbe4ee;
    border-radius:999px;
    padding:3px 10px;
    font-size:11px;
    font-weight:700;
    color:#334155;
    background:#fff;
    cursor:pointer;
  }
  .earn-filter-btn.is-active {
    background:#e2e8f0;
    border-color:#cbd5e1;
    color:#0f172a;
  }
  .earn-row.is-hidden { display:none; }
  .earn-row {
    display:grid;
    grid-template-columns:60px 1.5fr 1.5fr 100px;
    grid-template-areas:"time ident results status";
    align-items:center;
    gap:12px;
    min-height:48px;
    padding:6px 0;
    border-bottom:1px solid rgba(226,232,240,.55);
    font-size:12px;
  }
  .earn-row.js-earn-row { cursor:default; }
  .earn-tooltip {
    position:fixed;
    z-index:12000;
    pointer-events:none;
    min-width:220px;
    max-width:320px;
    border:1px solid #dbe4ee;
    border-radius:10px;
    background:#fff;
    box-shadow:0 10px 24px rgba(15,23,42,.18);
    padding:8px 10px;
    font-size:12px;
    color:#1f2f46;
    display:none;
    white-space:pre-line;
  }
  .earn-tooltip .tt-head { font-weight:800; color:#0f172a; margin-bottom:4px; }
  .index-drawer-overlay {
    position:fixed; inset:0; z-index:11500; background:rgba(15,23,42,.32); display:none;
  }
  .index-drawer {
    position:fixed; top:0; right:0; height:100vh; width:min(460px,92vw); z-index:11600;
    background:#fff; border-left:1px solid #dbe4ee; box-shadow:-12px 0 30px rgba(15,23,42,.18);
    transform:translateX(100%); transition:transform .22s ease; display:flex; flex-direction:column;
  }
  .index-drawer.open { transform:translateX(0); }
  .index-drawer-head {
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    border-bottom:1px solid #e2e8f0; padding:12px;
  }
  .index-drawer-title { font-size:14px; font-weight:800; color:#0f172a; }
  .index-drawer-close {
    border:1px solid #cbd5e1; background:#f8fafc; color:#334155;
    border-radius:8px; padding:4px 8px; font-size:12px; font-weight:800; cursor:pointer;
  }
  .index-drawer-body { padding:12px; display:grid; gap:10px; overflow:auto; }
  .id-card { border:1px solid #e2e8f0; border-radius:10px; background:#f8fafc; padding:10px; }
  .id-k { font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:.04em; }
  .id-v { margin-top:4px; font-size:22px; font-weight:900; color:#0f172a; }
  .id-chart { width:100%; height:160px; border:1px solid #e2e8f0; border-radius:10px; background:#fff; padding:8px; box-sizing:border-box; }
  .earn-row:last-child { border-bottom:none; }
  .earn-row .tk-strong { font-size:13px; font-weight:800; color:#0f172a; }
  .earn-time { border-radius:999px; font-size:10px; font-weight:800; padding:2px 8px; width:max-content; }
  .earn-time.pre { background:#fef3c7; color:#92400e; }
  .earn-time.post { background:#ede9fe; color:#6d28d9; }
  .earn-time.day { background:#dbeafe; color:#1d4ed8; }
  .earn-time { grid-area:time; }
  .earn-ident { min-width:0; display:flex; flex-direction:column; }
  .earn-ident { grid-area:ident; }
  .earn-company {
    color:#64748b;
    font-size:11px;
    margin-top:2px;
    white-space:normal;
    overflow:visible;
    text-overflow:clip;
    word-break:break-word;
    line-height:1.25;
  }
  .earn-results { min-width:0; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .earn-results { grid-area:results; }
  .earn-status { justify-self:end; }
  .earn-status { grid-area:status; display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
  .status-dot {
    display:none;
    width:10px; height:10px; border-radius:999px;
    border:1px solid #cbd5e1;
    background:#94a3b8;
  }
  .status-dot.reported { background:#6366f1; border-color:#6366f1; }
  .status-dot.upcoming { background:#94a3b8; border-color:#94a3b8; }
  .morning-item { line-height:1.6; }
  .pct-pos { color:#10b981; font-weight:700; }
  .pct-neg { color:#f43f5e; font-weight:700; }
  .spark {
    width:44px; height:14px;
    display:inline-block; margin-left:6px; vertical-align:middle;
  }

  .macro-grid { display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:1100px){ .macro-grid { grid-template-columns:1fr 2fr; } }
  .macro-head { margin:0 0 10px 0; font-size:14px; color:#0f172a; letter-spacing:.02em; text-transform:uppercase; }
  .macro-list { display:grid; gap:8px; }
  .macro-item {
    border:1px solid #e2e8f0;
    border-radius:10px;
    background:#f8fafc;
    padding:9px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .macro-k { color:#64748b; font-size:11px; text-transform:uppercase; letter-spacing:.03em; font-weight:700; }
  .macro-v { color:#0f172a; font-size:14px; font-weight:800; }
  .macro-panel {
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .macro-panel .macro-list {
    flex:1 1 auto;
    min-height:0;
    height:420px;
    overflow:auto;
    padding-right:4px;
  }

  .cmd-grid { display:grid; grid-template-columns:1fr; gap:8px; }
  @media (min-width:900px){ .cmd-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  .cmd-item {
    border:1px solid #e2e8f0;
    border-radius:10px;
    background:#fff;
    padding:9px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .cmd-k { color:#64748b; font-size:11px; text-transform:uppercase; letter-spacing:.03em; font-weight:700; }
  .cmd-v { font-size:14px; font-weight:800; color:#0f172a; }
  .cmd-v.critical { color:#f43f5e; }
  .wire-card { overflow:hidden; }
  .wire-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--space-8); }
  .wire-title { margin:0; font-size:13px; letter-spacing:.03em; text-transform:uppercase; color:#0f172a; }
  .wire-upd { color:#64748b; font-size:11px; }
  .wire-box { border:1px solid #e2e8f0; border-radius:10px; background:#f8fafc; padding:8px 10px; min-height:40px; display:grid; gap:8px; }
  .wire-item {
    display:block;
    text-decoration:none;
    color:#1e293b;
    font-size:12px;
    line-height:1.35;
    padding-bottom:8px;
    border-bottom:1px solid #e2e8f0;
  }
  .wire-item:last-child { border-bottom:none; padding-bottom:0; }
  .wire-tag {
    color:#64748b;
    font-weight:700;
    margin-right:4px;
  }
  .wire-live {
    border-color:#bfdbfe;
    background:linear-gradient(180deg, #f8fbff 0%, #eef6ff 100%);
  }
  .wire-live .wire-head {
    margin-bottom:10px;
    padding-bottom:8px;
    border-bottom:1px solid #dbeafe;
  }
  .live-badge {
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px solid #93c5fd;
    background:#dbeafe;
    color:#1d4ed8;
    border-radius:999px;
    padding:2px 8px;
    font-size:10px;
    font-weight:900;
    letter-spacing:.04em;
  }
  .live-dot {
    width:7px;
    height:7px;
    border-radius:999px;
    background:#2563eb;
    box-shadow:0 0 0 0 rgba(37,99,235,.65);
    animation:livePulse 1.6s infinite;
  }
  @keyframes livePulse {
    0% { box-shadow:0 0 0 0 rgba(37,99,235,.65); }
    70% { box-shadow:0 0 0 8px rgba(37,99,235,0); }
    100% { box-shadow:0 0 0 0 rgba(37,99,235,0); }
  }
  .wire-live .wire-box {
    background:#ffffff;
    border-color:#bfdbfe;
  }
  .wire-live .wire-item {
    color:#0b274a;
    font-size:13px;
    line-height:1.45;
    border-bottom-color:#dbeafe;
  }
  .wire-live .wire-tag {
    color:#1d4ed8;
    font-weight:800;
  }
  .lows-feed { max-height:360px; }
  .proposal-head { display:flex; justify-content:space-between; align-items:center; gap:var(--space-12); margin-bottom:var(--space-12); }
  .proposal-actions { display:flex; align-items:center; gap:var(--space-12); }
  .proposals-card { align-self:start; }
  .proposal-card { border:1px solid #e2e8f0; border-radius:12px; padding:12px; background:#fff; margin-bottom:var(--space-12); }
  .proposal-title-row { display:flex; justify-content:space-between; align-items:flex-start; gap:var(--space-12); }
  .proposal-title { font-size:14px; font-weight:800; color:#0f172a; margin-bottom:2px; }
  .proposal-title-wrap { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .chip-badge {
    display:inline-flex; align-items:center; gap:5px;
    border:1px solid #93a8c8;
    background:#edf3fb;
    color:#36537a;
    border-radius:999px;
    padding:2px 8px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .chip-badge.bluechip {
    border-color:#35537a;
    background:#36557d;
    color:#f1f6ff;
  }
  .chip-badge.macro {
    border-color:#93a8c8;
    background:#edf3fb;
    color:#36537a;
  }
  .proposal-list { margin-top:var(--space-8); margin-bottom:var(--space-8); }
  .proposal-insights { display:grid; grid-template-columns:1fr; gap:var(--space-8); margin-top:var(--space-8); margin-bottom:var(--space-8); }
  .proposal-insight { border:1px solid #e2e8f0; background:#f8fafc; border-radius:10px; padding:8px 10px; }
  .proposal-insight-label { font-size:11px; color:#64748b; font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px; }
  .proposal-insight-text { font-size:13px; color:#0f172a; line-height:1.35; }
  .proposal-meta-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .meta-chip {
    font-size:10px; font-weight:700; color:#475569;
    border:1px solid #dbe4ee; border-radius:999px; padding:2px 7px; background:#f8fafc;
  }
  .proposal-cites { display:flex; flex-wrap:wrap; gap:var(--space-8); margin-bottom:var(--space-8); }
  .proposal-btns { display:flex; gap:var(--space-8); }
  .proposal-btns .analyze-btn,
  .proposal-reject-form .analyze-btn,
  .js-reject-toggle {
    min-height:44px;
    padding:10px 12px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .proposal-reject-form { display:flex; gap:var(--space-8); align-items:center; margin-top:var(--space-8); }
  .proposal-reject-wrap[hidden] { display:none; }
  .proposal-reason-input {
    border:1px solid #cbd5e1; border-radius:8px; padding:6px 8px; min-width:260px;
    font-size:12px; color:#334155; background:#fff;
  }
  .proposal-empty {
    border:1px dashed #dbe4ee;
    border-radius:10px;
    padding:10px 12px;
    color:#64748b;
    font-size:12px;
    font-weight:700;
    background:#f8fafc;
  }
  .ai-hub-head {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:var(--space-8);
    margin-bottom:10px;
  }
  .ai-tabs { display:flex; flex-wrap:wrap; gap:6px; }
  .ai-tab-btn {
    border:1px solid #cbd5e1;
    border-radius:999px;
    background:#f8fafc;
    color:#334155;
    font-size:11px;
    font-weight:800;
    letter-spacing:.02em;
    padding:4px 10px;
    cursor:pointer;
  }
  .ai-tab-btn.is-active {
    background:#0f172a;
    border-color:#0f172a;
    color:#fff;
  }
  .ai-panel[hidden] { display:none; }
  .stack-list { display:grid; gap:8px; }
  .stack-item {
    border:1px solid #e2e8f0;
    border-radius:10px;
    background:#fff;
    padding:10px;
  }
  .stack-text { font-size:12px; color:#374151; margin-top:6px; line-height:1.45; }
  .stack-sub { margin-top:4px; }
